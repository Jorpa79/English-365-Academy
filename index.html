<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English 365 Academy V3.2</title> 
<style>body{font-family:Segoe UI,Arial;margin:0;background:#0b1220;color:#f8fafc}header{padding:18px;background:#111827;position:sticky;top:0}main{padding:20px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#172033;border:1px solid #334155;border-radius:16px;padding:17px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.bar{height:10px;background:#0b1220;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#38bdf8}.badge{background:#164e63;padding:4px 8px;border-radius:20px;font-size:12px}button,select{padding:10px;border:0;border-radius:10px;font-weight:700;margin:4px;background:#38bdf8;color:#082f49}.muted{color:#94a3b8}@media(max-width:750px){.grid,.stats{grid-template-columns:1fr}}</style></head><body>
<header><b>English 365 Academy V3.2</b> <span class="badge">Motor académico 52 semanas</span></header><main>
<div class="card"><h1>English 365 Academy</h1><p>Selecciona un perfil para probar el contenido académico.</p><select id="track" onchange="render()"><option value="adult">Adulto / Profesional</option><option value="university" selected>Universitario básico</option><option value="kids">Niños 10–12</option><option value="teens">Adolescentes 13–17</option></select></div>
<div id="app"></div></main>
<script>
const data={
adult:{min:30,goal:"A2 → B1 funcional",topics:["Vida diaria","Work English","Facilities & Safety","Quality y proveedores","Viajes"],q:"What's the status of the repair?",a:"The technician is working on it. It should be finished this afternoon."},
university:{min:30,goal:"A2 sólido → puente B1",topics:["Campus Survival","Vida universitaria","Proyectos y presentaciones","Prácticas e entrevistas","Conversation Builder"],q:"Why do you want this internship?",a:"I want to gain experience, improve my skills, and learn from the team."},
kids:{min:18,goal:"Base A1 oral y comprensiva",topics:["Hello English","My Day","English at School","English Around Me","Speak & Play"],q:"What's your favorite subject?",a:"My favorite subject is science because I like experiments."},
teens:{min:25,goal:"A1/A2 funcional",topics:["Everyday English","School & Life","Future Skills","Travel & Real Life","Conversation Builder"],q:"What do you want to study?",a:"I'd like to study engineering because I'm interested in technology."}};
let skills={Listening:72,Speaking:61,Vocabulary:84,Comprehension:78,Conversation:65},xp=380,week=7;
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.86;speechSynthesis.speak(u)}
function render(){let d=data[track.value];app.innerHTML=`<div class="stats">${[['⭐',xp,'XP'],['📅','S'+week,'Semana'],['⏱',d.min,'Min/día'],['🎯',d.goal,'Meta'],['🔥',7,'Racha']].map(x=>`<div class="card"><b>${x[0]} ${x[1]}</b><div class="muted">${x[2]}</div></div>`).join('')}</div>
<div class="grid"><div class="card"><h2>5 habilidades</h2>${Object.entries(skills).map(([k,v])=>`<p>${k} <b style="float:right">${v}%</b></p><div class="bar"><i style="width:${v}%"></i></div>`).join('')}</div>
<div class="card"><h2>Sesión de hoy</h2><p>Repaso → Listening → Speaking → Vocabulary → Conversation</p><h3>${d.q}</h3><button onclick='speak(${JSON.stringify(d.q)})'>🔊 Escuchar</button><button onclick="document.getElementById('model').style.display='block'">Mostrar modelo</button><p id="model" style="display:none">${d.a}</p></div>
<div class="card"><h2>Recomendación</h2><p>Prioridad actual: <b>Speaking</b>.</p><p>El motor aumenta Speak Challenge y recuperación oral hasta equilibrar el perfil.</p></div></div>
<h2>Ruta activa</h2><div class="grid">${d.topics.map((x,i)=>`<div class="card"><span class="badge">Etapa ${i+1}</span><h3>${x}</h3><p>${["Fundamentos","Comprensión","Aplicación","Producción","Integración"][i]}</p></div>`).join('')}</div>
<div class="card"><h2>Ruta 52 semanas</h2><p>1–4 Foundation · 5–8 Daily English · 9–12 Context English · 13–16 Communication · 17–20 Applied English · 21–24 Real-world Skills · 25–32 Conversation Expansion · 33–40 Independent Speaking · 41–48 A2/B1 Bridge · 49–52 Final Challenge.</p></div>
<div class="grid"><div class="card"><h2>🏆 Weekly Challenge</h2><p>Vocabulary 5 · Listening 3 · Speaking 3 · Situaciones 2 · Conversation 1.</p><button onclick="xp+=100;week++;render()">Completar demo +100 XP</button></div><div class="card"><h2>🧠 Repaso inteligente</h2><p>Hoy → 1 → 3 → 7 → 15 → 30 días.</p><p>El ejercicio cambia: significado → escucha → completar → repetir → producir.</p></div><div class="card"><h2>👨‍🏫 Panel docente</h2><p>Seguimiento por nivel, semana, tiempo, speaking, XP y alertas de alumnos que requieren apoyo.</p></div></div>`}render();
</script></body></html>
