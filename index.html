<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>English 365 Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07111f;--panel:#0e1b2c;--card:#13233a;--line:#2b405e;--txt:#f8fafc;--muted:#9fb0c6;--accent:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--vio:#a78bfa;--danger:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,"Segoe UI",system-ui,sans-serif;background:var(--bg);background-image:radial-gradient(1100px 520px at 85% -10%,#123257 0,transparent 60%);background-attachment:fixed;color:var(--txt);min-height:100vh}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
h1{font-size:clamp(24px,3vw,32px);letter-spacing:-.01em}h1,h2,h3{margin:.35em 0;line-height:1.2}
p{color:#cbd5e1;line-height:1.55;max-width:75ch}
label{display:block;color:#cbd5e1;font-size:13px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #334b69;border-radius:11px;background:#07111f;color:#fff}
textarea{min-height:96px;resize:vertical}
button{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);color:#082f49}.secondary{background:#334155;color:#fff}.success{background:var(--ok);color:#052e16}.ghost{background:transparent;border:1px solid #40536d;color:#dbeafe}.danger{background:#7f1d1d;color:#fff}.small{padding:7px 10px;font-size:13px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}.mt{margin-top:14px}.mt8{margin-top:8px}
.card{background:#0e1b2cf2;border:1px solid var(--line);border-radius:18px;padding:20px}
.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(560px,100%);background:#0e1b2cf5;border:1px solid var(--line);border-radius:20px;padding:24px}
.brand{display:flex;gap:14px;align-items:center}.logo{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,var(--accent),#2563eb);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.top{position:sticky;top:0;z-index:40;background:#07111feb;border-bottom:1px solid #24354e;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;backdrop-filter:blur(10px)}.top .logo{width:38px;height:38px;border-radius:10px;font-size:13px}
.menu-btn{display:none;background:transparent;border:1px solid #40536d;color:#fff;padding:7px 11px}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 61px)}
aside{background:#091525e6;border-right:1px solid #24354e;padding:14px;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto}
.nav{width:100%;text-align:left;background:transparent;color:#cbd5e1;margin:2px 0;font-weight:600}.nav.active,.nav:hover{background:#1d2d45;color:#fff}
.nav-sep{border:0;border-top:1px solid #2b405e;margin:10px 0}
main{padding:22px;max-width:1300px;width:100%}
.backdrop{position:fixed;inset:0;background:#0009;z-index:55}
.mobile-bottom{display:none}
.dt-in.ok{border-color:var(--ok);background:#052e1680}.dt-in.bad{border-color:var(--danger);background:#450a0a80}.dt-ans{margin:6px 0 2px;padding:6px 10px;border-radius:8px;background:#422006;color:#fde68a;font-weight:700}.dtclock.late,#dtClock.late{color:var(--warn)}
.reader{line-height:1.75;max-width:820px}.rs{padding:8px 10px;border-radius:10px;margin:2px 0;transition:background .2s}.rs.on{background:#0c4a6e66}.rs .who{font-size:12px;color:var(--muted);font-weight:800}
.rs-row{display:flex;gap:8px;align-items:flex-start}.rs-en{flex:1;min-width:0}.rs-tools{display:flex;gap:4px;flex:none;opacity:.75}.rs-tools .small{padding:4px 7px;font-size:12px}
.rs-es{color:#a5b4c8;font-size:.82em;font-style:italic;margin:2px 0 4px;border-left:3px solid #2b405e;padding-left:10px}
.tw{cursor:pointer;border-radius:4px;padding:0 1px}.tw:hover{background:#1d2d45;text-decoration:underline dotted #7dd3fc}.tw.sel{background:var(--accent);color:#082f49}
.wpop{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#0e1b2c;border:1px solid var(--accent);border-radius:16px 16px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px #000a;max-height:62vh;overflow:auto}
@media(min-width:701px){.wpop{border-radius:14px;bottom:auto;right:auto}}
.wp-m{margin:8px 0;padding:8px 10px;border:1px solid #2b405e;border-radius:10px;background:#0a1627}.wp-s{margin-top:8px;font-size:14px;color:#cbd5e1}
.choice.on{border-color:var(--accent);background:#0c4a6e}
details.guide summary{display:flex;gap:12px;align-items:center;cursor:pointer;list-style:none;font-size:18px}details.guide summary::-webkit-details-marker{display:none}details.guide summary .ri{flex:none;width:34px;height:34px;border-radius:10px;background:#1d2d45;display:grid;place-items:center}details.guide summary::after{content:'▾';margin-left:auto;color:var(--muted)}details.guide[open] summary::after{content:'▴'}details.guide ol{padding-left:22px;line-height:1.6}
.help-fab{position:fixed;right:18px;bottom:18px;z-index:44;width:46px;height:46px;border-radius:50%;padding:0;background:#1d2d45;border:1px solid var(--accent);color:#fff;font-size:20px;box-shadow:0 8px 24px #0007}
@media(max-width:1000px){.help-fab{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:12px;width:42px;height:42px;font-size:18px}}
.routine{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#0a1627;border:1px solid #334b69;color:#fff;font-weight:600;padding:13px}
.routine:hover{border-color:var(--accent)}.routine b{display:block;margin-bottom:2px}.routine .muted{font-size:13px;font-weight:400;display:block}
.routine .ri{flex:none;width:34px;height:34px;border-radius:10px;background:#1d2d45;display:grid;place-items:center;font-size:17px}
.routine.done{border-color:#166534}.routine.done .ri{background:var(--ok);color:#052e16;font-weight:800}
.chat{max-height:56vh;overflow:auto;padding-right:4px}
.corr-wrap{margin-top:8px;border-top:1px solid #ffffff22;padding-top:6px}
.corr{font-size:14px;padding:7px 9px;margin:6px 0;border-radius:9px;background:#07111f99;border:1px solid #2b405e}
.corr .bad{color:#fca5a5;text-decoration:line-through}.corr .good{color:#86efac;font-weight:700}.corr .ghost{margin-top:6px}
.tip{font-size:13px;margin-top:6px;color:#fde68a}
.mobile-navbtn{background:transparent;color:#cbd5e1;border-radius:12px;padding:6px 3px;min-height:54px;font-size:11px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;font-weight:700}
.mobile-navbtn .ico{font-size:21px;line-height:1}.mobile-navbtn.active{background:#1d2d45;color:#fff}
.install-step{padding:12px;margin:9px 0;background:#0a1627;border:1px solid #334b69;border-radius:12px;display:flex;gap:12px;align-items:flex-start}
.install-step .n{flex:none;width:26px;height:26px;border-radius:50%;background:#164e63;display:grid;place-items:center;font-weight:800}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(5,1fr)}.modules{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr 1fr}
.stat strong{display:block;font-size:28px;margin:4px 0}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#164e63;color:#cffafe;font-size:12px;font-weight:800}.badge.ok{background:#14532d;color:#dcfce7}.badge.warn{background:#78350f;color:#fef3c7}.badge.vio{background:#4c1d95;color:#ede9fe}
.progress{height:10px;border-radius:99px;background:#07111f;overflow:hidden;border:1px solid #2c415f}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok))}
.skill{display:grid;grid-template-columns:125px 1fr 44px;gap:9px;align-items:center;margin:11px 0}
.lesson{padding:12px;border:1px solid #334b69;border-radius:12px;background:#0a1627;margin:8px 0}
.phrase{font-size:25px;font-weight:800;margin:14px 0;line-height:1.3}
.phrase-en{font-size:19px;font-weight:800;line-height:1.35}
.phon{color:#7dd3fc;font-size:14px;margin-top:2px}
.sup{color:#cbd5e1;margin-top:2px}
.notice{border-left:4px solid var(--accent);background:#0a1627;padding:12px 14px;border-radius:10px;margin:10px 0}.notice.warn{border-color:var(--warn)}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #30435d;text-align:left}
.score{font-size:42px;font-weight:800;line-height:1}
.toast{position:fixed;right:18px;bottom:18px;background:#111827;border:1px solid #334155;padding:12px 16px;border-radius:12px;z-index:99;box-shadow:0 12px 30px #0007;max-width:min(420px,90vw)}
.choice{width:100%;text-align:left;background:#0a1627;color:#fff;border:1px solid #334b69;margin:5px 0;font-weight:600}.choice:hover:not(:disabled){border-color:var(--accent)}.choice.correct{border-color:var(--ok);background:#052e16}.choice.wrong{border-color:var(--danger);background:#450a0a}
.loading{cursor:progress}.loading main,.loading .login-card{opacity:.6;pointer-events:none}
/* Session steps: a real sequence, so they are numbered */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 16px}
.step{background:#0a1627;border:1px solid var(--line);color:var(--muted);text-align:left;font-weight:700}
.step small{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#1d2d45;margin-right:6px;font-size:12px}
.step.active{border-color:var(--accent);color:#fff}.step.done small{background:var(--ok);color:#052e16}
/* Word-by-word pronunciation feedback: the signature element */
.words{font-size:19px;line-height:2;margin:8px 0}
.w{padding:2px 5px;border-radius:6px;margin-right:2px}.w.hit{background:#14532d;color:#dcfce7}.w.miss{background:#78350f;color:#fef3c7;text-decoration:underline wavy #f59e0b80}
.blur{filter:blur(7px);user-select:none}
.bubble{max-width:82%;padding:10px 14px;border-radius:16px;margin:8px 0;background:#1e293b}.bubble.me{background:#0c4a6e;margin-left:auto}.bubble.cur{outline:2px solid var(--accent)}
.bubble .who{font-size:12px;color:var(--muted);font-weight:800}
.seg{display:inline-flex;border:1px solid #40536d;border-radius:10px;overflow:hidden;flex-wrap:wrap;max-width:100%}main{min-width:0}.card{min-width:0;max-width:100%}.seg button{border-radius:0;background:transparent;color:#cbd5e1;padding:7px 11px;font-size:13px}.seg button.on{background:var(--accent);color:#082f49}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #1e3350;cursor:pointer}.check input{width:18px;height:18px;margin-top:3px;flex:none}
.demo-banner{background:#422006;color:#fde68a;border-bottom:1px solid #78350f;padding:8px 16px;font-size:13px}
pre.plan{white-space:pre-wrap;background:#07111f;border:1px solid var(--line);padding:14px;border-radius:12px;font-family:inherit;line-height:1.55;color:#e2e8f0}
.rub{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.mobile-bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:#07111ff5;border-top:1px solid #30435d;padding:7px 7px calc(7px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(14px)}main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}input,select,textarea{font-size:16px}aside{position:fixed;left:0;top:0;height:100vh;width:280px;z-index:60;background:#091525;transform:translateX(-102%);transition:transform .2s ease;padding-top:18px}aside.open{transform:none}.stats,.modules,.split{grid-template-columns:1fr 1fr}.top .desktop{display:none}}
@media(max-width:680px){.stats,.modules,.split{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.stat strong{font-size:24px}.card{padding:16px}.steps{grid-template-columns:1fr 1fr}.skill{grid-template-columns:105px 1fr 40px}main{padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}.top{padding-top:calc(10px + env(safe-area-inset-top,0px))}.phrase{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="demoBanner" class="demo-banner hidden"></div>

<section id="loginView" class="login"><div class="login-card">
  <div class="row between">
    <div class="brand"><div class="logo">E365</div><div><h1>English 365 Academy</h1><div class="muted" id="appSub"></div></div></div>
  </div>
  <p id="loginIntro"></p>
  <label for="loginUser" id="lblUser"></label><input id="loginUser" autocomplete="username">
  <label for="loginPass" id="lblPass"></label><input id="loginPass" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:16px"><button class="primary" id="btnLogin" onclick="login()"></button><button class="ghost" id="btnTest" onclick="testConnection()"></button></div>
  <p class="muted" id="demoHint" style="font-size:12px"></p>
  <div id="loginMsg" role="status"></div>
</div></section>

<section id="appView" class="hidden">
  <header class="top">
    <div class="row"><div class="brand"><div class="logo">E365</div><b class="desktop">English 365 Academy</b></div></div>
    <div class="row"><span id="roleChip" class="badge desktop"></span><span id="trackChip" class="badge vio desktop"></span><button class="danger small" id="btnLogout" onclick="logout()"></button></div>
  </header>
  <div class="layout"><aside id="aside"></aside><main id="main"></main></div>
  <nav id="mobileBottom" class="mobile-bottom" aria-label="Menu"></nav>
  <button id="helpFab" class="help-fab" onclick="openHelp()" aria-label="Ayuda de esta sección" title="Ayuda de esta sección">❓</button>
</section>
<div id="backdrop" class="backdrop hidden" onclick="closeNav()"></div>
<div id="toast" class="toast hidden" role="status"></div>
<script>

const TRACKS={
 kids:{name:{es:'Niños 10–12'},minutes:18,cefr:'A1',goal:{es:'Base A1 oral y comprensiva'}},
 teens:{name:{es:'Adolescentes 13–17'},minutes:25,cefr:'A2',goal:{es:'A1/A2 funcional'}},
 university:{name:{es:'Universitario básico'},minutes:30,cefr:'A2',goal:{es:'A2 sólido → puente B1'}},
 adult:{name:{es:'Adulto / Profesional'},minutes:30,cefr:'A2',goal:{es:'A2 → B1 funcional'}},
 b1:{name:{es:'Conversación intermedia (B1)'},minutes:30,cefr:'B1',goal:{es:'Sostener conversaciones reales de 10–15 minutos'}},
 teacher:{name:{es:'Avanzado docente (B2–C1)'},minutes:40,cefr:'B2–C1',goal:{es:'Dar clases de inglés con seguridad'}}

const COURSES={
adult:[
 {week:1,title:'Introductions & Daily English',phrases:[
  ["Hi, how are you?", "jai, jau ar yu?", "Hola, ¿cómo estás?"],

 {week:2,title:'Work Status & Meetings',phrases:[

 {week:3,title:'Safety & Quality',phrases:[

  ["This finding needs corrective action.", "dis fáinding nids koréktiv ákshon", "Este hallazgo necesita acción correctiva."]],

 {week:4,title:'Suppliers & Reporting',phrases:[
  ["Please send the quotation today.", "plis send de kuotéishon tudéi", "Por favor envía la cotización hoy."],

],
university:[
 {week:1,title:'Campus Survival',phrases:[

  ["I have a question.", "ai jav a kuéschon", "Tengo una pregunta."]],
  question:"What are you studying?",model:"I'm studying engineering, and I'm interested in technology because I like solving problems."},
 {week:2,title:'University Life',phrases:[

  ["I usually study in the library.", "ai yúshuali stádi in de láibreri", "Normalmente estudio en la biblioteca."],
  ["I have an exam tomorrow.", "ai jav an igsám tumórou", "Tengo examen mañana."],
  ["Let's study together.", "lets stádi tugéder", "Estudiemos juntos."],

 {week:3,title:'Projects & Presentations',phrases:[

  ["I have experience with team projects.", "ai jav ikspíriens uid tim próyects", "Tengo experiencia con proyectos en equipo."],

  ["Thank you for the opportunity.", "zank yu for di oportúniti", "Gracias por la oportunidad."]],
  question:"Why do you want this internship?",model:"I want to gain experience, improve my skills, and learn from the team. I'm willing to learn and I work well in groups."}
],
kids:[
 {week:1,title:'Hello English',phrases:[
  ["Hi! My name is Sam.", "jai! mai neim is sam", "¡Hola! Me llamo Sam."],
  ["What's your name?", "juats yor neim?", "¿Cómo te llamas?"],

 {week:2,title:'School Day',phrases:[
  ["I go to school in the morning.", "ai gou tu skul in de mórning", "Voy a la escuela por la mañana."],
  ["This is my notebook.", "dis is mai nóutbuk", "Este es mi cuaderno."],
  ["Can I borrow a pencil?", "kan ai bárou a pénsil?", "¿Me prestas un lápiz?"],
  ["It's time for lunch.", "its taim for lanch", "Es hora de comer."],
  ["See you tomorrow!", "si yu tumórou!", "¡Nos vemos mañana!"]],

b1:[
 {week:1,title:'Small Talk That Keeps Going',grammar:{es:'Pasado simple + preguntas de seguimiento (What did you…? Where did you…?)'},phrases:[
  ["How was your weekend?", "jau uós yor uíkend?", "¿Qué tal tu fin de semana?"],
  ["That sounds great! What did you do?", "dat saunds greit! juat díyu du?", "¡Suena genial! ¿Qué hiciste?"],
  ["Really? Tell me more about it.", "ríli? tel mi mor abáut it", "¿En serio? Cuéntame más."],
  ["I know what you mean.", "ai nou juat yu min", "Sé a qué te refieres."],
  ["Anyway, how's work going?", "éniuei, jaus uork góuing?", "En fin, ¿cómo va el trabajo?"]],
  dialogue:[["A","Hey! How was your weekend?"],["B","It was great, thanks. I went hiking with some friends."],["A","That sounds fun! Where did you go?"],["B","We went to a small mountain near the city. How about you?"]],
  question:"How was your weekend?",model:"It was really nice, thanks. On Saturday I visited my family, and on Sunday I just relaxed at home. How about you?"},
 {week:2,title:'Talking About Experiences',grammar:{es:'Presente perfecto: Have you ever…? / I\'ve never… / for + tiempo'},phrases:[
  ["Have you ever been to Japan?", "jav yu éver bin tu yapán?", "¿Alguna vez has ido a Japón?"],
  ["I've never tried real ramen.", "aiv néver traid ril rámen", "Nunca he probado ramen auténtico."],
  ["I've worked here for five years.", "aiv uorkt jir for faiv yirs", "He trabajado aquí por cinco años."],
  ["It was one of the best trips of my life.", "it uós uan ov de best trips ov mai laif", "Fue uno de los mejores viajes de mi vida."],
  ["What was the hardest part?", "juat uós de járdest part?", "¿Qué fue lo más difícil?"]],
  dialogue:[["A","Have you ever traveled abroad?"],["B","Yes, I've been to Japan twice for work."],["A","Wow! What was it like?"],["B","It was amazing, but the hardest part was the language."]],
  question:"What is an interesting experience you have had?",model:"I've visited Japan once for work. It was one of the best trips of my life because the people were very kind and everything was so organized."},
 {week:3,title:'Opinions & Agreeing',grammar:{es:'Dar y justificar opiniones: In my opinion… because… / On the other hand…'},phrases:[
  ["In my opinion, it's a good idea.", "in mai opínion, its a gud aidía", "En mi opinión, es una buena idea."],
  ["I see your point, but I'm not sure.", "ai si yor point, bat aim not shur", "Entiendo tu punto, pero no estoy seguro."],
  ["I totally agree with you.", "ai tóutali agrí uid yu", "Estoy totalmente de acuerdo contigo."],
  ["What's your take on this?", "juats yor teik on dis?", "¿Qué opinas de esto?"],
  ["On the other hand, it could be expensive.", "on di óder jand, it kud bi ikspénsiv", "Por otro lado, podría ser caro."]],
  dialogue:[["A","What's your take on working from home?"],["B","I think it's great because I save a lot of time."],["A","I see your point, but I miss talking to people."],["B","That's true. Maybe two days at home is the best option."]],
  question:"Is it better to work from home or at the office?",model:"In my opinion, a mix is better. Working from home saves time, but on the other hand, at the office it's easier to solve problems with the team."},
 {week:4,title:'Plans & Arrangements',grammar:{es:'Futuro: going to (planes) · presente continuo (citas) · How about…?'},phrases:[
  ["What are you doing this weekend?", "juat ar yu dúing dis uíkend?", "¿Qué vas a hacer este fin de semana?"],
  ["I'm going to visit my parents.", "aim góuing tu vísit mai pérents", "Voy a visitar a mis papás."],
  ["Are you free on Friday?", "ar yu fri on fráidei?", "¿Estás libre el viernes?"],
  ["How about meeting at six?", "jau abáut míting at siks?", "¿Qué tal si nos vemos a las seis?"],
  ["Sorry, I can't make it. Maybe next time.", "sóri, ai kant meik it. méibi nekst taim", "Perdón, no puedo. Tal vez la próxima."]],
  dialogue:[["A","Are you free on Friday night?"],["B","I think so. What do you have in mind?"],["A","How about dinner at that new Japanese restaurant?"],["B","Sounds perfect. Let's meet at seven."]],
  question:"What are your plans for next month?",model:"Next month I'm going to take a short trip to the beach with my family. I'm also planning to study English every day because I want to improve my speaking."},
 {week:5,title:'Problems & Solutions',grammar:{es:'Primer condicional: If we…, it will… · explicar lo que pasó'},phrases:[
  ["We have a problem with the machine.", "ui jav a próblem uid de mashín", "Tenemos un problema con la máquina."],
  ["It stopped working this morning.", "it stopt uórking dis mórning", "Dejó de funcionar esta mañana."],
  ["What do you suggest?", "juat du yu sayést?", "¿Qué sugieres?"],
  ["If we change the part, it will work.", "if ui cheinch de part, it uil uork", "Si cambiamos la pieza, funcionará."],
  ["Let me explain what happened.", "let mi ikspléin juat jápend", "Déjame explicar lo que pasó."]],
  dialogue:[["A","Let me explain what happened. The line stopped at nine."],["B","Do you know why?"],["A","We think a sensor failed. What do you suggest?"],["B","If we replace the sensor today, we can restart this afternoon."]],
  question:"Describe a problem you solved recently.",model:"Last week a machine stopped working in the morning. First, we checked the sensors, and then we changed a damaged part. After that, it worked perfectly."},
 {week:6,title:'Telling Stories',grammar:{es:'Pasado continuo + pasado simple (I was…when…) · First, then, finally'},phrases:[
  ["I was driving to work when it started to rain.", "ai uós dráiving tu uork juen it stártid tu rein", "Iba manejando al trabajo cuando empezó a llover."],
  ["First, I called my boss. Then, I waited.", "ferst, ai kold mai bos. den, ai uéitid", "Primero, llamé a mi jefe. Luego, esperé."],
  ["Suddenly, I heard a loud noise.", "sádenli, ai jerd a laud nois", "De repente, escuché un ruido fuerte."],
  ["You won't believe what happened!", "yu uount bilív juat jápend!", "¡No vas a creer lo que pasó!"],
  ["In the end, everything was fine.", "in di end, évrizing uós fain", "Al final, todo salió bien."]],
  dialogue:[["A","You won't believe what happened this morning!"],["B","What happened?"],["A","I was driving to work when my car stopped in the middle of the street."],["B","Oh no! What did you do?"]],
  question:"Tell me a funny or strange story that happened to you.",model:"Last year I was walking in the park when suddenly a dog took my sandwich! First, I was surprised, and then I started laughing. In the end, the owner bought me another one."}

teacher:[
 {week:1,title:'Classroom Language & Instructions',grammar:{es:'Imperativos suaves + ICQs (preguntas para verificar instrucciones)'},phrases:[
  ["Work in pairs and compare your answers.", null, "Trabajen en parejas y comparen sus respuestas."],
  ["You have five minutes. Ready? Go!", null, "Tienen cinco minutos. ¿Listos? ¡Ya!"],
  ["Could someone summarize what we've just discussed?", null, "¿Alguien podría resumir lo que acabamos de comentar?"],
  ["Don't worry about mistakes; focus on getting your message across.", null, "No se preocupen por los errores; concéntrense en transmitir su mensaje."],
  ["Let's go over the answers together.", null, "Revisemos las respuestas juntos."]],
  dialogue:[["A","Sorry, what do we have to do?"],["B","You're going to interview your partner about their weekend."],["A","Do we need to write the answers?"],["B","No, just speak. So, are you writing or speaking?"]],
  question:"How would you give instructions for a pair-work activity?",model:"First, I'd demonstrate the activity with a strong student. Then I'd give short, clear instructions, set a time limit, and check understanding with a couple of instruction-checking questions before they start."},
 {week:2,title:'Explaining Grammar Clearly',grammar:{es:'Forma · significado · uso + CCQs (preguntas para verificar el concepto)'},phrases:[
  ["We use the present perfect to connect the past with the present.", null, "Usamos el presente perfecto para conectar el pasado con el presente."],
  ["Let's look at the form: have or has plus the past participle.", null, "Veamos la estructura: have o has más el participio pasado."],
  ["Notice the difference between these two sentences.", null, "Observen la diferencia entre estas dos oraciones."],
  ["Is the action finished, or is it still true now?", null, "¿La acción terminó o sigue siendo cierta ahora?"],
  ["Can you think of an example from your own life?", null, "¿Puedes pensar en un ejemplo de tu propia vida?"]],
  dialogue:[["A","Teacher, what's the difference between 'I lived' and 'I've lived'?"],["B","Good question. Look at this timeline. Do I live in Monterrey now?"],["A","No, you don't."],["B","Right, so we say 'I lived'. It's finished."]],
  question:"How would you explain the difference between 'I lived' and 'I have lived'?",model:"I'd use a timeline. 'I lived in Monterrey' means it's finished; I don't live there now. 'I have lived here for ten years' started in the past and is still true. Then I'd ask concept-checking questions like: Do I live here now?"},
 {week:3,title:'Correcting Errors & Giving Feedback',grammar:{es:'Corrección inmediata vs. diferida · recast · autocorrección'},phrases:[
  ["Almost! Can you try that again?", null, "¡Casi! ¿Puedes intentarlo de nuevo?"],
  ["Listen carefully: 'she goes', not 'she go'.", null, "Escucha bien: 'she goes', no 'she go'."],
  ["That's a really good point. How would you say it more formally?", null, "Es un muy buen punto. ¿Cómo lo dirías de forma más formal?"],
  ["Great improvement! Your pronunciation is much clearer now.", null, "¡Gran mejora! Tu pronunciación es mucho más clara ahora."],
  ["I noticed a few common mistakes; let's look at them together.", null, "Noté algunos errores comunes; veámoslos juntos."]],
  dialogue:[["A","Yesterday I go to the cinema with my friends."],["B","Nice! Yesterday you… go? Or…?"],["A","Oh, yesterday I went to the cinema."],["B","Perfect! What did you see?"]],
  question:"How do you correct a student without discouraging them?",model:"It depends on the activity. During fluency practice I'd note mistakes and give delayed feedback at the end. For accuracy work, I'd use a recast or a quick prompt like 'Almost, try again', so the student can self-correct."},
 {week:4,title:'Planning a Lesson (PPP / TBL)',grammar:{es:'Objetivos de clase: By the end of the lesson, students will be able to…'},phrases:[
  ["By the end of the lesson, students will be able to make polite requests.", null, "Al final de la clase, los alumnos podrán hacer peticiones corteses."],
  ["We'll start with a short warm-up to activate vocabulary.", null, "Empezaremos con un calentamiento corto para activar vocabulario."],
  ["Then students will practice in a controlled activity.", null, "Luego los alumnos practicarán en una actividad controlada."],
  ["The final task is a role-play in a restaurant.", null, "La tarea final es un juego de roles en un restaurante."],
  ["I'll monitor and collect errors for feedback.", null, "Monitorearé y recopilaré errores para la retroalimentación."]],
  dialogue:[["A","What's the main aim of your lesson?"],["B","By the end, students will be able to make polite requests."],["A","And how will you check they've achieved it?"],["B","They'll do a role-play, and I'll monitor with a checklist."]],
  question:"Describe the structure of a 50-minute lesson you would teach.",model:"I'd start with a five-minute warm-up, then present the target language in context. After that, students would do controlled practice, followed by a freer speaking task like a role-play. I'd finish with feedback on the most common errors."},
 {week:5,title:'Managing the Class & Motivating',grammar:{es:'Peticiones indirectas: I\'d like to hear from… / Could you two…?'},phrases:[
  ["Let's give everyone a chance to speak.", null, "Demos a todos la oportunidad de hablar."],
  ["Could you two swap roles, please?", null, "¿Podrían ustedes dos intercambiar roles, por favor?"],
  ["I'd like to hear from someone who hasn't spoken yet.", null, "Me gustaría escuchar a alguien que no haya hablado todavía."],
  ["Phones away for now, please; we'll use them later.", null, "Guarden los teléfonos por ahora; los usaremos después."],
  ["You've made huge progress this month. Keep it up!", null, "Han progresado muchísimo este mes. ¡Sigan así!"]],
  dialogue:[["A","Teacher, I don't want to speak. My English is bad."],["B","I understand. How about practicing with a partner first?"],["A","Okay, but just with my partner."],["B","Perfect. Take two minutes to prepare, and I'll help you if you need it."]],
  question:"What would you do if a student never participates?",model:"First, I'd try to understand why; it might be anxiety or their level. I'd give them time to prepare in pairs before speaking to the whole class, and I'd give specific positive feedback when they participate."},
 {week:6,title:'Professional English for Teachers',grammar:{es:'Presente perfecto continuo para experiencia: I\'ve been teaching…'},phrases:[
  ["I've been teaching English for three years, mainly to adults.", null, "He enseñado inglés por tres años, principalmente a adultos."],
  ["My teaching approach is communicative and student-centered.", null, "Mi enfoque de enseñanza es comunicativo y centrado en el alumno."],
  ["Your son is making steady progress, especially in speaking.", null, "Su hijo está progresando de forma constante, sobre todo en speaking."],
  ["One area to work on is his writing accuracy.", null, "Un área a trabajar es la precisión en su escritura."],
  ["I'd recommend reading in English for ten minutes a day.", null, "Recomendaría leer en inglés diez minutos al día."]],
  dialogue:[["A","Tell me about your teaching experience."],["B","I've been teaching English for three years, mainly to adults at a company."],["A","How would you describe your approach?"],["B","It's communicative and student-centered. Students speak a lot from day one."]],
  question:"Why would you be a good English teacher?",model:"I've been learning English for years, so I understand my students' difficulties. My approach is communicative: I want students to speak from the first class, and I give clear feedback so they can see their progress."}
]};

/* ============================ RPC (Apps Script o demo) ============================ */
async function rpcRemote(fn,args){
  let res;
  try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({method:fn,args}),redirect:'follow'})}
  catch(e){throw new Error('No hay conexión con el servidor. Revisa tu internet o la URL de API_URL.')}
  if(!res.ok)throw new Error('El servidor respondió con error '+res.status+'.');
  const txt=await res.text();if(!txt)throw new Error(t('emptyResp'));
  try{return JSON.parse(txt)}catch(e){throw new Error(/<html/i.test(txt)?'La URL de API_URL no es la implementación /exec correcta o no tiene acceso para "Cualquier usuario".':t('badResp')+e.message)}
}
function rpc(fn,...args){
  if(DEMO)return mockApi(fn,args);
  if(MODE==='remote')return rpcRemote(fn,args);
  return new Promise((resolve,reject)=>{
    google.script.run
      .withSuccessHandler(raw=>{
        try{
          if(raw===null||typeof raw==='undefined'||raw===''){reject(new Error(t('emptyResp')));return}
          resolve(typeof raw==='string'?JSON.parse(raw):raw);
        }catch(e){reject(new Error(t('badResp')+e.message))}
      })
      .withFailureHandler(e=>reject(new Error((e&&e.message)?e.message:String(e||'Apps Script error'))))
      .api(fn,JSON.stringify(args));
  });
}

let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()}catch(e){VOICES=[]}}

function pickVoice(alt){const same=VOICES.filter(v=>v.lang&&v.lang.replace('_','-')===P.accent);const pool=same.length?same:VOICES.filter(v=>v.lang&&v.lang.startsWith('en'));const good=pool.filter(v=>/Google|Natural|Neural|Samantha|Daniel|Aria|Jenny|Guy/i.test(v.name));const list=good.length?good:pool;return list.length?list[alt&&list.length>1?1:0]:null}
function speakText(txt,o={}){
  if(!('speechSynthesis' in window)){toast(t('noTTS'));return Promise.resolve()}
  return new Promise(res=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=P.accent;const v=pickVoice(o.alt);if(v)u.voice=v;u.rate=o.rate||P.rate;if(o.alt&&!(v&&pickVoice(false)!==v))u.pitch=.8;let done=false;const fin=()=>{if(!done){done=true;clearTimeout(tm);res()}};const words=String(txt).split(/\s+/).length,tm=setTimeout(fin,Math.max(2500,words*650/(u.rate||1)));u.onend=u.onerror=fin;try{speechSynthesis.speak(u)}catch(e){fin()}});
}

/* ============================ Voz: reconocimiento ============================ */
function listen(){
  return new Promise((res,rej)=>{
    if(!SR)return rej(new Error(t('noSR')));
    if('speechSynthesis' in window)speechSynthesis.cancel();
    const r=new SR();r.lang=P.accent;r.interimResults=false;r.maxAlternatives=3;let done=false;
    r.onresult=e=>{done=true;res([...e.results[0]].map(a=>a.transcript))};
    r.onerror=e=>{if(done)return;done=true;rej(new Error(e.error==='not-allowed'||e.error==='service-not-allowed'?t('micDenied'):e.error==='no-speech'?t('noSpeech'):t('srError')))};
    r.onend=()=>{if(!done){done=true;rej(new Error(t('noSpeech')))}};
    try{r.start()}catch(e){rej(new Error(t('srError')))}
  });
}

const CONTR={"they'd":"they would","he'd":"he would","she'd":"she would","it'd":"it would","weren't":"were not","shan't":"shall not","he'll":"he will","she'll":"she will","gonna":"going to","wanna":"want to","gotta":"got to","ain't":"am not","y'all":"you all","i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","what's":"what is","where's":"where is","how's":"how is","who's":"who is","there's":"there is","here's":"here is","let's":"let us","i'll":"i will","you'll":"you will","we'll":"we will","it'll":"it will","they'll":"they will","i'd":"i would","you'd":"you would","we'd":"we would","i've":"i have","we've":"we have","you've":"you have","they've":"they have","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","haven't":"have not","hasn't":"has not","shouldn't":"should not","couldn't":"could not","wouldn't":"would not"};
const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function norm(s){const out=[];String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:"()…—–-]/g,' ').split(/\s+/).forEach(w=>{if(!w)return;const e=CONTR[w];(e?e.split(' '):[w]).forEach(x=>{x=x.replace(/'/g,'').replace(/[^a-z0-9]/g,'');if(!x)return;if(/^\d+$/.test(x)&&+x<=20)x=NUM[+x];out.push(x)})});return out}
function align(target,heard){
  const toks=target.split(/\s+/).filter(Boolean),a=[],owner=[];
  toks.forEach((tk,ti)=>norm(tk).forEach(w=>{a.push(w);owner.push(ti)}));
  const b=norm(heard),n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  const l=dp[0][0];
  const tokHit=toks.map((_,ti)=>{const idx=owner.map((o,k)=>o===ti?k:-1).filter(k=>k>=0);return idx.length?idx.every(k=>hit[k]):true});
  const score=n?Math.round(100*(.75*l/n+.25*(m?l/m:0))):0;
  return {score,toks,tokHit,heard};
}
function bestAlign(target,alts){return alts.map(x=>align(target,x)).sort((x,y)=>y.score-x.score)[0]}
function wordsHTML(r){return `<div class="words">${r.toks.map((w,i)=>`<span class="w ${r.tokHit[i]?'hit':'miss'}">${h(w)}</span>`).join(' ')}</div>`}
function repHTML(r){return `<div class="row mt8"><div class="score">${r.score}%</div><div class="grow">${wordsHTML(r)}<div class="muted">${t('heard',h(r.heard))}</div></div></div>`}

const STOP=new Set('a an the i you he she it we they my your our his her their is am are was were be been being do does did to of in on at for and or but so with this that these those what how why when where who me us them have has had will would can could should about just very really not from as by if then there here some any all also its it’s'.split(' '));
const CONNECT=['and','but','because','so','then','also','however','first','after that','finally','although','for example','on the other hand','in my opinion','actually','while','when'];
function evalFree(answer,c,minW){
  minW=minW||minWords();const w=norm(answer),set=new Set(w),low=' '+w.join(' ')+' ';
  const keys=uniq(norm(c.question+' '+c.model).filter(x=>x.length>3&&!STOP.has(x)));
  const hits=keys.filter(k=>set.has(k));
  const lenS=Math.min(1,w.length/minW),relS=Math.min(1,hits.length/Math.max(2,Math.min(6,Math.round(keys.length*.35)))),con=CONNECT.filter(x=>low.includes(' '+x+' ')).length,conS=Math.min(1,con/2);
  const score=Math.round(lenS*40+relS*40+conS*20),tips=[];
  if(lenS<1)tips.push(t('tip_len'));if(relS<.6)tips.push(t('tip_rel'));if(conS<1)tips.push(t('tip_con'));if(!tips.length)tips.push(t('tip_good'));
  return {score,len:Math.round(lenS*100),rel:Math.round(relS*100),con:Math.round(conS*100),words:w.length,tips,text:answer};
}
function freeHTML(r){const bar=(k,v)=>`<div class="rub"><span>${t(k)}</span><div class="progress"><div style="width:${v}%"></div></div><b>${v}</b></div>`;return `<div class="lesson"><div class="row"><div class="score">${r.score}%</div><div class="grow muted">${h(r.text)}</div></div>${bar('fb_len',r.len)}${bar('fb_rel',r.rel)}${bar('fb_con',r.con)}${r.tips.map(x=>`<div class="notice">${h(x)}</div>`).join('')}<p class="muted" style="font-size:12px">${t('estNote')}</p></div>`}

function skillBars(s){return Object.keys(SKILLS).map(k=>{const v=Math.max(0,Math.min(100,Number(s[k]||0)));return `<div class="skill"><span>${SKILLS[k]}</span><div class="progress" role="progressbar" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><div style="width:${v}%"></div></div><b>${v}</b></div>`}).join('')}
function weakest(){const s=B.skills;return Object.keys(SKILLS).sort((a,b)=>(s[a]||0)-(s[b]||0))[0]}
function recommend(){const k=weakest();const target={writing:'writing',listening:'listening',speaking:'speak',vocabulary:'vocab',comprehension:'lectura',conversation:'ai'}[k];return `<div class="notice"><b>${t('priority',SKILLS[k])}</b><p>${t('rec_'+k)}</p><button class="primary small" onclick="go('${target}')">${t('nav_'+target)}</button></div>`}

/* ============================ Sesión guiada en 4 pasos ============================ */
function today(){startSession(currentCourse())}
function openWeek(w){const arr=COURSES[activeTrack()];startSession(arr.find(x=>x.week===w)||currentCourse())}
function startSession(c){S={c,step:0,listened:new Set(),showText:false,rep:{},repD:{},quiz:buildQuiz(c,c.phrases.slice(0,4).map((_,i)=>i),['meaning','listening']),qi:0,qok:0,qdone:false,prod:null,prodRes:null,prodText:''};currentPage='today';REG=[];renderNav();renderSession();window.scrollTo(0,0)}
function stepDone(i){const n=S.c.phrases.length;return [S.listened.size>=n,Object.keys(S.rep).length>=n,S.qdone,S.prod!==null][i]}
function renderSession(){
  const c=S.c,tr=TRACKS[activeTrack()],names=['st_listen','st_repeat','st_check','st_produce'];
  M().innerHTML=`<h1>▶ ${h(c.title)}</h1><p>${t('sessionLine',tr.minutes)}</p>${c.grammar?`<div class="notice">${h(L(c.grammar))}</div>`:''}
  <div class="steps">${names.map((k,i)=>`<button class="step ${i===S.step?'active':''} ${stepDone(i)?'done':''}" onclick="S.step=${i};renderSession()" aria-current="${i===S.step?'step':'false'}"><small>${stepDone(i)?'✓':i+1}</small>${t(k)}</button>`).join('')}</div><div id="stepBody"></div>`;
  [stepListen,stepRepeat,stepCheck,stepProduce][S.step]();
}
function navBtns(){return `<div class="row between mt"><button class="ghost" ${S.step===0?'disabled':''} onclick="S.step--;renderSession()">${t('prev')}</button>${S.step<3?`<button class="primary" onclick="S.step++;renderSession()">${t('next')}</button>`:`<button class="success" onclick="completeSession()">${t('complete')}</button>`}</div>`}
function stepListen(){
  const c=S.c;
  $('stepBody').innerHTML=`<div class="card"><p>${t('listenIntro')}</p><div class="row"><button class="primary" onclick="playAll()">${t('playAll')}</button><button class="ghost" onclick="S.showText=!S.showText;renderSession()">${S.showText?t('hideText'):t('showText')}</button></div>
  ${c.phrases.map((p,i)=>{const x=P_(p);return `<div class="lesson row"><button class="primary small" aria-label="play" onclick="listenOne(${i})">🔊</button><div class="grow ${S.showText?'':'blur'}" aria-hidden="${!S.showText}"><b>${h(x.en)}</b><div class="sup">${h(sup(x))}</div></div><span class="muted">${S.listened.has(i)?'✓':''}</span></div>`}).join('')}${navBtns()}</div>`;
}
function listenOne(i){S.listened.add(i);renderSession();speakText(S.c.phrases[i][0])}
async function playAll(){const s=S;for(let i=0;i<s.c.phrases.length;i++){if(S!==s||currentPage!=='today')return;s.listened.add(i);if(s.step===0)renderSession();await speakText(s.c.phrases[i][0]);await new Promise(r=>setTimeout(r,500))}}
function stepRepeat(){
  const c=S.c;
  $('stepBody').innerHTML=`<div class="card"><p>${t('repeatIntro')}</p>${SR?'':`<div class="notice warn">${t('noSRnote')}</div>`}${c.phrases.map((p,i)=>phraseCard(p,i)).join('')}${navBtns()}</div>`;
}
function phraseCard(p,i){
  const x=P_(p),ph=phon(x),id=R(x.en);
  return `<div class="lesson"><div class="phrase-en">${h(x.en)}</div>${ph?`<div class="phon">${h(ph)}</div>`:''}<div class="sup">${h(sup(x))}</div>
  <div class="row mt8"><button class="primary small" aria-label="play" onclick="say(${id})">🔊</button><button class="ghost small" onclick="say(${id},1)">${t('slow')}</button>${SR?`<button class="success small" onclick="repeatPhrase(${i})">${t('rec')}</button>`:`<button class="ghost small" onclick="selfRate(${i},80)">${t('selfOk')}</button><button class="ghost small" onclick="selfRate(${i},50)">${t('selfHard')}</button>`}<button class="ghost small" onclick="markReview(${i})">${t('review')}</button></div>${SR?'':`<div class="row mt8"><input id="dict${i}" class="grow" style="width:auto" placeholder="${t('dictPh')}" autocapitalize="off" onkeydown="if(event.key==='Enter')dictEval(${i})"><button class="success small" onclick="dictEval(${i})">${t('dictEval')}</button></div>`}
  <div id="rep${i}">${S.repD[i]?repHTML(S.repD[i]):(S.rep[i]!=null?`<p class="muted">✓ ${S.rep[i]}%</p>`:'')}</div></div>`;
}
async function repeatPhrase(i){const box=$('rep'+i);box.innerHTML=`<p class="muted">${t('listening')}</p>`;try{const alts=await listen();const r=bestAlign(S.c.phrases[i][0],alts);S.rep[i]=Math.max(S.rep[i]||0,r.score);S.repD[i]=r;box.innerHTML=repHTML(r);logSpeak(r.score)}catch(e){box.innerHTML=`<p class="muted">${h(e.message)}</p>`}}
function dictEval(i){const v=$('dict'+i).value.trim();if(!v){toast(t('writeFirst'));return}const r=align(S.c.phrases[i][0],v);S.rep[i]=Math.max(S.rep[i]||0,r.score);S.repD[i]=r;$('rep'+i).innerHTML=repHTML(r);logSpeak(r.score)}
function selfRate(i,v){S.rep[i]=v;$('rep'+i).innerHTML=`<p class="muted">✓ ${v}%</p>`}
async function markReview(i){const c=S.c,x=P_(c.phrases[i]);try{const r=await rpc('addReviewItem',token,{itemId:activeTrack()+'_'+c.week+'_'+i,english:x.en,spanish:x.es,phonetic:x.phEs||''});toast((r&&r.message)||t('saved'))}catch(e){toast(e.message)}}

/* Quiz: significado, audio o completar */
function buildQuiz(c,idxs,types){
  const pool=COURSES[activeTrack()].flatMap(w=>w.phrases);
  const clean=w=>w.replace(/[^A-Za-z']/g,'');
  return idxs.map((i,k)=>{
    const x=P_(c.phrases[i]),type=types[k%types.length],others=shuffle(c.phrases.filter((_,j)=>j!==i)).slice(0,3);
    if(type==='meaning')return {type,en:x.en,opts:shuffle([{v:sup(x),ok:1},...others.map(o=>({v:sup(P_(o)),ok:0}))])};
    if(type==='listening')return {type,en:x.en,opts:shuffle([{v:x.en,ok:1},...others.map(o=>({v:o[0],ok:0}))])};
    const words=x.en.split(' '),cand=words.map((w,wi)=>({w:clean(w),wi,cap:/^[A-Z]/.test(w)&&wi>0})).filter(o=>o.w.length>3&&!o.cap&&!STOP.has(o.w.toLowerCase()));
    const pk=cand.length?cand[Math.floor(Math.random()*cand.length)]:{w:clean(words[0]),wi:0},right=pk.w.toLowerCase();
    const shown=words.map((w,wi)=>wi===pk.wi?w.replace(pk.w,'_____'):w).join(' ');
    const dis=shuffle(uniq(pool.flatMap(q=>q[0].split(' ').map(w=>clean(w).toLowerCase())).filter(w=>w.length>3&&w!==right&&!STOP.has(w)))).slice(0,3);
    return {type:'gap',en:x.en,shown,hint:sup(x),opts:shuffle([{v:right,ok:1},...dis.map(d=>({v:d,ok:0}))])};
  });
}
function quizHTML(q,handler){
  let head='';
  if(q.type==='meaning')head=`<div class="phrase">${h(q.en)}</div><button class="ghost small" onclick="say(${R(q.en)})">${t('playAudio')}</button><p>${t('meaningQ')}</p>`;
  else if(q.type==='listening'){head=`<p>${t('listenQ')}</p><button class="primary" onclick="say(${R(q.en)})">${t('playAudio')}</button>`;setTimeout(()=>speakText(q.en),250)}
  else head=`<p>${t('gapQ')}</p><div class="phrase">${h(q.shown)}</div><p class="muted">${h(q.hint)}</p>`;
  return head+q.opts.map(o=>`<button class="choice" data-ok="${o.ok}" onclick="pick(this,'${handler}')">${h(o.v)}</button>`).join('');
}
function pick(btn,handler){const ok=btn.dataset.ok==='1';document.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(x.dataset.ok==='1')x.classList.add('correct')});if(!ok)btn.classList.add('wrong');setTimeout(()=>window[handler](ok),ok?550:1300)}
function stepCheck(){
  if(S.qdone){$('stepBody').innerHTML=`<div class="card"><div class="score">${pct(S.qok,S.quiz.length)}%</div><p>${t('quizDone',pct(S.qok,S.quiz.length))}</p><button class="ghost" onclick="S.quiz=buildQuiz(S.c,shuffle(S.c.phrases.map((_,i)=>i)).slice(0,4),['listening','gap','meaning']);S.qi=0;S.qok=0;S.qdone=false;renderSession()">${t('retry')}</button>${navBtns()}</div>`;return}
  $('stepBody').innerHTML=`<div class="card"><span class="badge">${t('qn',S.qi+1,S.quiz.length)}</span>${quizHTML(S.quiz[S.qi],'sessAnswer')}</div>`;
}
function sessAnswer(ok){if(currentPage!=='today')return;if(ok)S.qok++;S.qi++;if(S.qi>=S.quiz.length)S.qdone=true;renderSession()}
function stepProduce(){
  const c=S.c;
  $('stepBody').innerHTML=`<div class="card"><div class="phrase">${h(c.question)}</div><div class="row"><button class="primary" onclick="say(${R(c.question)})">${t('listenQuestion')}</button>${SR?`<button class="success" onclick="produceMic()">${t('answerMic')}</button>`:''}</div>
  <p>${t('produceIntro',minWords())}</p><label for="prodText">${t('orWrite')}</label><textarea id="prodText">${h(S.prodText)}</textarea>
  <div class="row mt8"><button class="secondary" onclick="produceEval($('prodText').value)">${t('evaluate')}</button><button class="ghost" onclick="$('modelBox').classList.toggle('hidden')">${t('showModel')}</button></div>
  <div id="prodRes">${S.prodRes?freeHTML(S.prodRes):''}</div><div id="modelBox" class="hidden notice"><p>${h(c.model)}</p><button class="ghost small" onclick="say(${R(c.model)})">${t('listenModel')}</button></div>${navBtns()}</div>`;
}
async function produceMic(){const box=$('prodRes');box.innerHTML=`<p class="muted">${t('listening')}</p>`;try{const alts=await listen();$('prodText').value=alts[0];produceEval(alts[0])}catch(e){box.innerHTML=`<p class="muted">${h(e.message)}</p>`}}
function produceEval(txt){if(!txt.trim()){toast(t('writeFirst'));return}S.prodText=txt;S.prodRes=evalFree(txt,S.c);S.prod=S.prodRes.score;$('prodRes').innerHTML=freeHTML(S.prodRes);logConv(S.prod)}
async function completeSession(){
  const n=S.c.phrases.length,listenS=pct(S.listened.size,n),repV=Object.values(S.rep),repS=repV.length?avg(repV):null,quizS=S.qdone?pct(S.qok,S.quiz.length):null,prodS=S.prod;
  const parts=[listenS||null,repS,quizS,prodS].filter(v=>v!==null);
  if(parts.length<2){toast(t('needMore'));return}
  const score=avg(parts),d=v=>v==null?0:Math.round(v/100*3),tr=TRACKS[activeTrack()],xp=20+Math.round(score*.4);
  const skillDelta={listening:d(quizS==null?listenS:(listenS+quizS)/2),speaking:d(repS),vocabulary:d(quizS),comprehension:d(quizS),conversation:d(prodS)};
  try{setLoading(true);
    const r=await rpc('saveLearningSession',token,{minutes:tr.minutes,xp,week:B.week,unit:S.c.title,lessonKey:activeTrack()+'_w'+S.c.week,score,skillDelta});
    if(!r||!r.ok)throw new Error((r&&r.message)||t('badLogin'));
    if(r.bootstrap)B=Object.assign(B,r.bootstrap);toast(t('sessionSaved',xp));S=null;go('home');
  }catch(e){toast(e.message)}finally{setLoading(false)}
}

/* ============================ Speaking ============================ */
async function saveSpeak(score,q,heard,model,ctx,source){try{const s=await rpc('saveSpeakResult',token,{score,context:ctx||currentCourse().title,question:q,heard,model,source:source||'voice'});if(s&&s.ok){if(s.bootstrap)B=Object.assign(B,s.bootstrap);toast(t('speakSaved',s.xp??0))}}catch(e){toast(e.message)}}
function speak(){
  const c=currentCourse();if(SP.i>=c.phrases.length)SP.i=0;
  const seg=['repeat','free'].map(m=>`<button class="${SP.mode===m?'on':''}" onclick="SP.mode='${m}';SP.res=null;go('speak')">${t('mode_'+m)}</button>`).join('');
  let body;
  if(SP.mode==='repeat'){const x=P_(c.phrases[SP.i]),ph=phon(x),id=R(x.en);
    body=`<div class="card"><span class="badge vio">${h(c.title)}</span><div class="phrase">${h(x.en)}</div>${ph?`<div class="phon">${h(ph)}</div>`:''}<div class="sup">${h(sup(x))}</div>
    <div class="row mt"><button class="primary" onclick="say(${id})">🔊</button><button class="ghost" onclick="say(${id},1)">${t('slow')}</button><button class="success" onclick="speakRepeat()" ${SR?'':'disabled'}>${t('rec')}</button><button class="ghost" onclick="SP.i=(SP.i+1)%${c.phrases.length};SP.res=null;go('speak')">${t('newPhrase')}</button></div>
    ${SR?'':`<div class="notice warn">${t('noSRnote')}</div><div class="row"><input id="spDict" class="grow" style="width:auto" placeholder="${t('dictPh')}" autocapitalize="off"><button class="success" onclick="speakDict()">${t('dictEval')}</button></div>`}<div id="spRes">${SP.res?repHTML(SP.res):''}</div><p class="muted" style="font-size:12px">${t('estNote')}</p></div>`;
  }else{
    body=`<div class="card"><span class="badge vio">${h(c.title)}</span><div class="phrase">${h(c.question)}</div><div class="row"><button class="primary" onclick="say(${R(c.question)})">${t('listenQuestion')}</button><button class="success" onclick="speakFree()" ${SR?'':'disabled'}>${t('answerMic')}</button></div>
    <p>${t('produceIntro',minWords())}</p><label for="spText">${t('orWrite')}</label><textarea id="spText"></textarea><div class="row mt8"><button class="secondary" onclick="speakFreeEval($('spText').value,false)">${t('evaluate')}</button><button class="ghost" onclick="$('spModel').classList.toggle('hidden')">${t('showModel')}</button></div>
    <div id="spRes">${SP.res?freeHTML(SP.res):''}</div><div id="spModel" class="hidden notice"><p>${h(c.model)}</p><button class="ghost small" onclick="say(${R(c.model)})">${t('listenModel')}</button></div></div>`;
  }
  M().innerHTML=`<h1>${t('speakTitle')}</h1><div class="seg" style="margin-bottom:14px">${seg}</div>${body}`;
}
async function speakRepeat(){const c=currentCourse(),target=c.phrases[SP.i][0];$('spRes').innerHTML=`<p class="muted">${t('listening')}</p>`;try{const alts=await listen();SP.res=bestAlign(target,alts);$('spRes').innerHTML=repHTML(SP.res);logSpeak(SP.res.score);saveSpeak(SP.res.score,target,SP.res.heard,target)}catch(e){$('spRes').innerHTML=`<p class="muted">${h(e.message)}</p>`}}
function speakDict(){const v=$('spDict').value.trim();if(!v){toast(t('writeFirst'));return}const target=currentCourse().phrases[SP.i][0];SP.res=align(target,v);$('spRes').innerHTML=repHTML(SP.res);logSpeak(SP.res.score);saveSpeak(SP.res.score,target,v,target,null,'typed')}
async function speakFree(){$('spRes').innerHTML=`<p class="muted">${t('listening')}</p>`;try{const alts=await listen();$('spText').value=alts[0];speakFreeEval(alts[0],true)}catch(e){$('spRes').innerHTML=`<p class="muted">${h(e.message)}</p>`}}
function speakFreeEval(txt,spoken){if(!txt.trim()){toast(t('writeFirst'));return}const c=currentCourse();SP.res=evalFree(txt,c);$('spRes').innerHTML=freeHTML(SP.res);logConv(SP.res.score);saveSpeak(SP.res.score,c.question,txt,c.model,null,spoken?'voice':'typed')}

/* ============================ Role-play ============================ */
function roleplay(){const c=currentCourse();if(!RP||RP.c!==c){const d=c.dialogue||[['A',c.question],['B',c.model]];RP={c,d,me:'B',i:-1,res:{},hide:false,done:false,noDlg:!c.dialogue}}renderRP()}
function renderRP(){
  const o=RP.me==='B'?'A':'B',cur=RP.d[RP.i],myTurn=cur&&cur[0]===RP.me&&!RP.done;
  M().innerHTML=`<h1>${t('rpTitle')}</h1><p>${t('rpIntro',`<b>${RP.me}</b>`,`<b>${o}</b>`)}</p>${RP.noDlg?`<div class="notice">${t('rpNoDialogue')}</div>`:''}
  <div class="card"><div class="row between"><span class="badge vio">${h(RP.c.title)}</span><label class="row" style="margin:0"><input type="checkbox" style="width:auto" ${RP.hide?'checked':''} onchange="RP.hide=this.checked;renderRP()"> ${t('rpHide')}</label></div>
  <div class="mt">${RP.d.map(([who,line],i)=>{if(i>RP.i)return '';const mine=who===RP.me,hidden=mine&&RP.hide&&!RP.res[i];const r=RP.res[i];
    return `<div class="bubble ${mine?'me':''} ${i===RP.i&&!RP.done?'cur':''}"><div class="who">${who}</div>${hidden?'…':h(line)}${r?`<div class="muted" style="font-size:13px">${r.score}% · ${h(r.heard)}</div>`:''}</div>`}).join('')}</div>
  ${myTurn?`<div class="notice">${t('rpYourTurn')}</div><div class="row">${SR?`<button class="success" onclick="rpMic()">🎙</button>`:''}<button class="ghost" onclick="rpSelf()">${t('rpSaid')}</button>${RP.hide?'':`<button class="ghost small" onclick="say(${R(cur[1])})">🔊</button>`}</div>`:''}
  ${RP.done?`<div class="score mt">${avg(Object.values(RP.res).map(r=>r.score))}%</div><p>${t('rpDone',avg(Object.values(RP.res).map(r=>r.score)))}</p>`:''}
  <div class="row mt"><button class="primary" onclick="rpStart()">${RP.i<0?t('rpStart'):t('rpRestart')}</button><button class="ghost" onclick="RP.me=RP.me==='B'?'A':'B';RP.i=-1;RP.res={};RP.done=false;renderRP()">${t('rpSwap')}</button></div></div>`;
}
function rpStart(){RP.i=-1;RP.res={};RP.done=false;rpNext()}
async function rpNext(){
  const rp=RP;rp.i++;
  if(rp.i>=rp.d.length){rp.done=true;renderRP();const sc=avg(Object.values(rp.res).map(r=>r.score));LSset(d=>{d.rp=(d.rp||0)+1});saveSpeak(sc,'Role-play',Object.values(rp.res).map(r=>r.heard).join(' / '),rp.d.map(x=>x[1]).join(' / '),'Role-play: '+rp.c.title);return}
  renderRP();
  const [who,line]=rp.d[rp.i];
  if(who!==rp.me){await speakText(line,{alt:true});if(RP===rp&&currentPage==='roleplay')rpNext()}
}
async function rpMic(){const line=RP.d[RP.i][1];try{const alts=await listen();let r=bestAlign(line,alts);if(RP.hide){const ratio=Math.min(1,norm(r.heard).length/Math.max(1,norm(line).length));r.score=Math.round(r.score*.5+ratio*50)}RP.res[RP.i]=r;logSpeak(r.score);rpNext()}catch(e){toast(e.message)}}
function rpSelf(){RP.res[RP.i]={score:70,heard:'✓'};rpNext()}

      return `<div class="card"><span class="badge warn">Lv ${h(x.level)}</span><div class="phrase-en mt8">${h(x.english)}</div>${ph?`<div class="phon">${h(ph)}</div>`:''}<p>${h(tr)}</p><div class="row"><button class="primary small" onclick="say(${R(x.english)})">🔊</button><button class="success small" onclick="reviewResult(${id},true)">${t('remembered')}</button><button class="ghost small" onclick="reviewResult(${id},false)">${t('hard')}</button></div></div>`}).join('')}</div>`:`<div class="card"><h3>${t('noDue')}</h3><p>${t('noDueHint')}</p><button class="primary" onclick="go('today')">${t('nav_today')}</button></div>`}`;

function corrHTML(list,key){return (list||[]).map((c,j)=>`<div class="corr"><span class="bad">${h(c.original)}</span> → <span class="good">${h(c.better)}</span>${c.why?`<div class="muted">${h(c.why)}</div>`:''}<button class="ghost small" onclick="corrToReview(${R(c)})">⭐ Repasar</button></div>`).join('')}
function renderAIChat(){
  const sc=AIC.custom?['custom',AIC.icon,AIC.title]:scenarioOf(AIC.scenario),users=AIC.messages.filter(m=>m.role==='user').length;
  M().innerHTML=`<div class="row between"><h1 style="margin:0">${sc[1]} ${h(sc[2])}</h1><div class="row"><label class="row" style="margin:0"><input type="checkbox" style="width:auto;min-height:0" ${AIC.voice?'checked':''} onchange="AIC.voice=this.checked"> Leer en voz alta</label></div></div>

  ${AIC.summary?'':`<label for="aiInput">Tu respuesta en inglés</label><textarea id="aiInput" placeholder="Escribe o usa el micrófono…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();aiSend()}" ${AIC.busy?'disabled':''}></textarea>

  <div class="row mt"><button class="ghost small" onclick="AIC=null;renderAIPick()">↺ Nueva conversación</button>${AIC.custom?`<button class="ghost small" onclick="AIC=null;go('library')">← Mis materiales</button>`:''}</div></div>`;

async function aiSend(txt){
  const inp=$('aiInput');txt=(txt??(inp?inp.value:'')).trim();if(!txt||AIC.busy)return;
  AIC.messages.push({role:'user',content:txt.slice(0,1000)});const idx=AIC.messages.length-1;AIC.busy=true;renderAIChat();
  try{const r=await rpc('aiChat',token,{mode:'chat',scenario:AIC.scenario,custom:AIC.custom,title:AIC.title,level:aiLevel(),messages:AIC.messages});if(!r||!r.ok)throw new Error((r&&r.message)||'Sin respuesta de la IA.');
    AIC.corr[idx]=r.corrections||[];AIC.messages.push({role:'assistant',content:r.reply});if(r.tip)AIC.tips[AIC.messages.length-1]=r.tip;if(AIC.voice)speakText(r.reply)}
  catch(e){toast(e.message);if(inp)setTimeout(()=>{const n=$('aiInput');if(n)n.value=txt},0);AIC.messages.pop()}
  finally{AIC.busy=false;if(currentPage==='ai')renderAIChat()}
}

  try{const r=await rpc('aiChat',token,{mode:'summary',scenario:AIC.scenario,custom:AIC.custom,title:AIC.title,level:aiLevel(),messages:AIC.messages,minutes,spoken:AIC.spoken});if(!r||!r.ok)throw new Error((r&&r.message)||'No pude generar la evaluación.');

}

let LIB={},LIBINFO=null;
const LIBKEY=t=>'e365_lib_'+((B&&B.user&&(B.user.username||B.user.name))||'anon')+'_'+t;
async function libInfo(force){
  if(LIBINFO&&!force)return LIBINFO;
  const r=await rpc('getLibraryInfo',token);if(!r||!r.ok)throw new Error((r&&r.message)||'No pude consultar tus materiales.');
  let prev='';try{prev=localStorage.getItem(LIBKEY('version'))||''}catch(e){}
  if(prev!==r.version){LIB={};try{Object.keys(localStorage).filter(k=>k.startsWith(LIBKEY(''))).forEach(k=>localStorage.removeItem(k));localStorage.setItem(LIBKEY('version'),r.version)}catch(e){}}
  LIBINFO=r;return r;
}
async function lib(tipo){
  if(LIB[tipo])return LIB[tipo];
  await libInfo();
  try{const c=JSON.parse(localStorage.getItem(LIBKEY(tipo))||'null');if(c&&c.v===LIBINFO.version){LIB[tipo]=c.items;return c.items}}catch(e){}
  const r=await rpc('getLibrary',token,tipo);if(!r||!r.ok)throw new Error((r&&r.message)||'No pude cargar el material.');
  const items=r.items.sort((a,b)=>a.orden-b.orden);LIB[tipo]=items;
  try{localStorage.setItem(LIBKEY(tipo),JSON.stringify({v:LIBINFO.version,items}))}catch(e){}
  return items;
}
async function libRefresh(){LIB={};LIBINFO=null;try{Object.keys(localStorage).filter(k=>k.startsWith(LIBKEY(''))).forEach(k=>localStorage.removeItem(k))}catch(e){}toast('Materiales actualizados');go('library')}
function groupsOf(items){const m=new Map();items.forEach(x=>{if(!m.has(x.grupo))m.set(x.grupo,[]);m.get(x.grupo).push(x)});return [...m.entries()]}

/* ---------- Comparación de respuestas ---------- */
function variantsOf(ans){
  const base=String(ans).replace(/[“”"]/g,'').trim(),out=new Set([base]);
  base.split(/\s+\/\s+/).forEach(v=>out.add(v));
  [...out].forEach(v=>{out.add(v.replace(/\([^)]*\)/g,' '));out.add(v.replace(/[()]/g,''))});
  return [...out].map(v=>v.replace(/\s+/g,' ').trim()).filter(Boolean);
}
function sameAnswer(user,expected){const u=norm(user).join(' ');if(!u)return false;return variantsOf(expected).some(v=>norm(v).join(' ')===u)}
function closeness(user,expected){return Math.max(...variantsOf(expected).map(v=>align(v,user).score))}

const SUBJ=[['I','yo'],['you','tú'],['he','él'],['she','ella'],['it','eso'],['we','nosotros'],['they','ellos']];
const TENSES=[['present','Presente simple','Pista: todos los días…'],['continuous','Presente continuo','Pista: en este momento…'],['past','Pasado simple','Pista: hace una semana…'],['perfect','Presente perfecto','Pista: desde que vivo aquí…'],['will','Futuro (will)','Pista: en el futuro…'],['going','Futuro (going to)','Pista: mañana a las 3 pm…'],['would','Condicional (would)','Pista: si pudiera…']];

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function conj(v,tense,form,s){

  const W={
    present:{aff:b?`${s} ${beP}`:`${s} ${third?ex.s3:base}`,neg:b?`${s} ${beP} not`:`${s} ${doP} not ${base}`,q:b?`${cap(qBe)} ${qs}?`:`${cap(qThird?'does':'do')} ${qs} ${base}?`,yes:b?`Yes, ${as} ${as==='I'?'am':beP}.`:`Yes, ${as} ${as==='I'?'do':doP}.`,no:b?`No, ${as} ${as==='I'?'am':beP} not.`:`No, ${as} ${as==='I'?'do':doP} not.`},
    continuous:{aff:`${s} ${beP} ${ex.ing}`,neg:`${s} ${beP} not ${ex.ing}`,q:`${cap(qBe)} ${qs} ${ex.ing}?`,yes:`Yes, ${as} ${as==='I'?'am':beP}.`,no:`No, ${as} ${as==='I'?'am':beP} not.`},
    past:{aff:b?`${s} ${pastBe}`:`${s} ${ex.past.split(' / ')[0]}`,neg:b?`${s} ${pastBe} not`:`${s} did not ${base}`,q:b?`${cap((qs==='I'||qThird)?'was':'were')} ${qs}?`:`Did ${qs} ${base}?`,yes:b?`Yes, ${as} ${(as==='I'||third)?'was':'were'}.`:`Yes, ${as} did.`,no:b?`No, ${as} ${(as==='I'||third)?'was':'were'} not.`:`No, ${as} did not.`},
    perfect:{aff:`${s} ${haveP} ${ex.part.split(' / ')[0]}`,neg:`${s} ${haveP} not ${ex.part.split(' / ')[0]}`,q:`${cap(qThird?'has':'have')} ${qs} ${ex.part.split(' / ')[0]}?`,yes:`Yes, ${as} ${as==='I'?'have':haveP}.`,no:`No, ${as} ${as==='I'?'have':haveP} not.`},
    will:{aff:`${s} will ${base}`,neg:`${s} will not ${base}`,q:`Will ${qs} ${base}?`,yes:`Yes, ${as} will.`,no:`No, ${as} will not.`},
    going:{aff:`${s} ${beP} going to ${base}`,neg:`${s} ${beP} not going to ${base}`,q:`${cap(qBe)} ${qs} going to ${base}?`,yes:`Yes, ${as} ${as==='I'?'am':beP}.`,no:`No, ${as} ${as==='I'?'am':beP} not.`},
    would:{aff:`${s} would ${base}`,neg:`${s} would not ${base}`,q:`Would ${qs} ${base}?`,yes:`Yes, ${as} would.`,no:`No, ${as} would not.`}};

const CONTRACT=[[/\bI am\b/g,"I'm"],[/\b(you|we|they) are\b/gi,"$1're"],[/\b(he|she|it) is\b/gi,"$1's"],[/\bis not\b/g,"isn't"],[/\bare not\b/g,"aren't"],[/\bdo not\b/g,"don't"],[/\bdoes not\b/g,"doesn't"],[/\bdid not\b/g,"didn't"],[/\bhave not\b/g,"haven't"],[/\bhas not\b/g,"hasn't"],[/\bwill not\b/g,"won't"],[/\bwould not\b/g,"wouldn't"],[/\bwas not\b/g,"wasn't"],[/\bwere not\b/g,"weren't"],[/\bam not\b/g,"'m not"],[/\b(I|you|we|they) have\b/g,"$1've"],[/\b(he|she|it) has\b/gi,"$1's"],[/\b(I|you|he|she|it|we|they) will\b/gi,"$1'll"],[/\b(I|you|he|she|it|we|they) would\b/gi,"$1'd"]];

/* ============================ Dictado de vocabulario ============================
   1) Estudias la lista (inglés, pronunciación y español) con tiempo.
   2) Escuchas cada palabra y escribes: inglés, significado en español y pronunciación.
   No avanzas hasta que las 3 estén bien. Si se acaba el tiempo, ves la respuesta,
   la copias correctamente, cuenta como error y la palabra vuelve al final. */
let DT=null,DTICK=null;
function dtStopTick(){if(DTICK){clearInterval(DTICK);DTICK=null}}
const dtEligible=x=>x.en&&x.es&&!/[→+]/.test(x.en);
const stripAcc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function canonEn(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,!?¡¿;:"“”]/g,' ').replace(/\s+/g,' ').trim()}
function canonEs(s){return stripAcc(String(s).toLowerCase()).replace(/[.,!?¡¿;:"“”]/g,' ').replace(/\s+/g,' ').trim().replace(/^(el|la|los|las|un|una|unos|unas)\s+/,'')}
function canonPr(s){return String(s).toLowerCase().replace(/[\/\s\-]/g,'')}
function dtEnOk(a,en){const c=canonEn(a);return !!c&&variantsOf(en).some(v=>canonEn(v)===c)}
function dtEsOk(a,es){const c=canonEs(a);if(!c)return false;const alts=String(es).split(/\s+[\/\-–]\s+|\s*\/\s*/).flatMap(variantsOf);return alts.some(v=>canonEs(v)===c)}
function dtPrOk(a,pr){if(!pr)return true;const c=canonPr(a);return !!c&&c===canonPr(pr)}
const dtSay=(x,slow)=>speakText(x.en.split(' / ')[0].replace(/\(([^)]*)\)/g,'$1'),slow?{rate:.6}:{});
function dictado(){LSset(d=>{d.fcMode='dict'});go('vocab')}
async function dtSetup(gi){
  const g=REG[gi],items=(await lib('vocab')).filter(x=>x.grupo===g&&dtEligible(x));
  if(!items.length){toast('Este bloque no tiene palabras para dictado.');return}
  const st=LS().dtCfg||{size:10,study:120,word:60};
  DT={grupo:g,title:(items[0].extra.topic||g).split(' · ')[0],all:items,size:st.size,studySec:st.study,wordSec:st.word,phase:'setup'};renderDT();
}
function dtCfg(k,v){DT[k]=v;LSset(d=>{d.dtCfg={size:DT.size,study:DT.studySec,word:DT.wordSec}});renderDT()}
function dtBeginStudy(){
  const n=DT.size==='all'?DT.all.length:Math.min(DT.size,DT.all.length);
  DT.list=shuffle(DT.all).slice(0,n);DT.phase='study';DT.left=DT.studySec;DT.started=Date.now();DT.firstOk=0;DT.failed=new Set();DT.tried=new Set();
  renderDT();dtStopTick();DTICK=setInterval(()=>{if(currentPage!=='vocab'||!DT||DT.phase!=='study')return dtStopTick();DT.left--;const c=$('dtClock');if(c)c.textContent=fmtSec(DT.left);if(DT.left<=0)dtBeginWrite()},1000);
}
const fmtSec=s=>Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0');
async function dtPlayAll(){const D=DT;for(const x of D.list){if(DT!==D||D.phase!=='study'||currentPage!=='vocab')return;await dtSay(x);await new Promise(r=>setTimeout(r,400))}}
function dtBeginWrite(){dtStopTick();speechSynthesis.cancel();DT.phase='write';DT.queue=shuffle(DT.list.map((_,i)=>i));DT.reveal=false;dtNextWord(true)}
function dtNextWord(first){
  if(!first)DT.queue.shift();
  if(!DT.queue.length)return dtFinish();
  DT.reveal=false;DT.left=DT.wordSec;renderDT();const x=DT.list[DT.queue[0]];setTimeout(()=>dtSay(x),250);
  dtStopTick();DTICK=setInterval(()=>{if(currentPage!=='vocab'||!DT||DT.phase!=='write'||DT.reveal)return dtStopTick();DT.left--;const c=$('dtClock');if(c){c.textContent=fmtSec(DT.left);c.classList.toggle('late',DT.left<=10)}if(DT.left<=0)dtTimeout()},1000);
}
function dtVals(){return {en:($('dtEn')||{}).value||'',es:($('dtEs')||{}).value||'',pr:($('dtPr')||{}).value||''}}
function dtMark(id,ok){const el=$(id);if(el){el.classList.toggle('ok',ok);el.classList.toggle('bad',!ok)}}
function dtCheck(){
  const i=DT.queue[0],x=DT.list[i],v=dtVals();
  const r={en:dtEnOk(v.en,x.en),es:dtEsOk(v.es,x.es),pr:dtPrOk(v.pr,x.pron)};
  dtMark('dtEn',r.en);dtMark('dtEs',r.es);if(x.pron)dtMark('dtPr',r.pr);
  const msg=$('dtMsg');
  if(r.en&&r.es&&r.pr){
    dtStopTick();
    if(!DT.reveal&&!DT.tried.has(i)){DT.firstOk++}
    DT.tried.add(i);
    msg.innerHTML=`<div class="notice" style="border-color:var(--ok)">✓ ¡Correcto! ${DT.reveal?'Esta palabra volverá al final para que la escribas sin ayuda.':''}</div>`;
    if(DT.reveal)DT.queue.push(i);
    $('dtBtn').disabled=true;setTimeout(()=>{if(DT&&DT.phase==='write')dtNextWord()},DT.reveal?1600:900);
  }else{
    const bad=[!r.en&&'inglés',!r.es&&'español',!r.pr&&'pronunciación'].filter(Boolean);
    msg.innerHTML=`<div class="notice warn">Revisa: ${bad.join(', ')}. ${DT.reveal?'Copia la respuesta tal como aparece.':'Corrige y vuelve a comprobar.'}</div>`;
    const first=bad[0]==='inglés'?'dtEn':bad[0]==='español'?'dtEs':'dtPr';const el=$(first);if(el)el.focus();
  }
}
function dtTimeout(){
  dtStopTick();const i=DT.queue[0];DT.reveal=true;DT.failed.add(i);DT.tried.add(i);
  const v=dtVals();renderDT();['dtEn','dtEs','dtPr'].forEach(id=>{const el=$(id);if(el){el.value=id==='dtEn'?v.en:id==='dtEs'?v.es:v.pr}});dtCheckSilent();
}
function dtCheckSilent(){const x=DT.list[DT.queue[0]],v=dtVals();dtMark('dtEn',dtEnOk(v.en,x.en));dtMark('dtEs',dtEsOk(v.es,x.es));if(x.pron)dtMark('dtPr',dtPrOk(v.pr,x.pron))}
function dtFinish(){
