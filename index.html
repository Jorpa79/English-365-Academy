o solo, así que siguió el procedimiento de bloqueo y esperó."], ["Twenty minutes later, the electrician arrived and thanked him for securing the area.", "Veinte minutos después, llegó la electricista y le agradeció por asegurar el área."], ["Together they replaced the breaker and tested the system step by step.", "Juntos reemplazaron el interruptor y probaron el sistema paso a paso."], ["By two in the morning, the line was running again.", "Para las dos de la mañana, la línea ya estaba funcionando otra vez."], ["The next day, the plant manager asked Roberto to write a short report.", "Al día siguiente, el gerente de planta le pidió a Roberto que escribiera un reporte breve."], ["In the report, he suggested a monthly inspection of the electrical panels.", "En el reporte, sugirió una inspección mensual de los tableros eléctricos."], ["The manager liked the idea, and it became part of the maintenance plan.", "Al gerente le gustó la idea y se volvió parte del plan de mantenimiento."]], "glossary": {"almost": "casi", "midnight": "medianoche", "lights": "luces", "suddenly": "de repente", "went out": "se apagaron", "shift": "turno", "leader": "líder", "grabbed": "agarró, tomó", "flashlight": "linterna", "ran": "corrió", "electrical": "eléctrico", "production": "producción", "line": "línea", "had stopped": "se había detenido", "stopped": "se detuvo", "operators": "operadores", "instructions": "instrucciones", "made sure": "se aseguró", "nobody": "nadie", "hurt": "herido, lastimado", "safe": "seguro (sin peligro)", "called": "llamó", "electrician": "electricista", "on duty": "de guardia", "duty": "deber, servicio", "didn't": "no (pasado)", "while": "mientras", "checked": "revisó", "main": "principal", "panel": "tablero", "found": "encontró", "burnt": "quemado", "breaker": "interruptor, pastilla térmica", "knew": "sabía", "shouldn't": "no debería", "replace": "reemplazar", "alone": "solo", "followed": "siguió", "lockout": "bloqueo (de energía)", "procedure": "procedimiento", "waited": "esperó", "later": "después", "arrived": "llegó", "thanked": "agradeció", "securing": "asegurar", "area": "área", "together": "juntos", "replaced": "reemplazaron", "tested": "probaron", "system": "sistema", "step by step": "paso a paso", "running": "funcionando", "again": "otra vez", "manager": "gerente", "asked": "pidió / preguntó", "write": "escribir", "report": "reporte, informe", "suggested": "sugirió", "monthly": "mensual", "inspection": "inspección", "liked": "le gustó", "idea": "idea", "became": "se convirtió en", "part": "parte", "maintenance": "mantenimiento"}, "questions": [{"q": "What happened at midnight?", "o": ["A machine caught fire", "The lights went out", "An operator got hurt"], "a": 1}, {"q": "What was the first thing Roberto did?", "o": ["He replaced the breaker", "He called the manager", "He made sure nobody was hurt and the machines were safe"], "a": 2}, {"q": "Why didn't Roberto replace the breaker alone?", "o": ["He didn't have the tools", "He followed the lockout procedure and waited for the electrician", "He was too tired"], "a": 1}, {"q": "What did Roberto suggest in his report?", "o": ["Hiring more electricians", "A monthly inspection of the electrical panels", "Working only during the day"], "a": 1}]}, {"id": "b1-interview", "level": "B1", "topic": "Trabajo", "title": "The Interview", "title_es": "La entrevista", "text": [["Elena had been looking for a new job for three months.", "Elena llevaba tres meses buscando un trabajo nuevo."], ["One day, she received an email from an international company.", "Un día, recibió un correo de una empresa internacional."], ["They wanted to interview her, and part of the interview would be in English.", "Querían entrevistarla, y parte de la entrevista sería en inglés."], ["Elena felt excited, but also afraid, because she hadn't spoken English in years.", "Elena se sintió emocionada, pero también con miedo, porque no había hablado inglés en años."], ["She decided to prepare every evening for two weeks.", "Decidió prepararse todas las tardes durante dos semanas."], ["She practiced answering common questions out loud in front of a mirror.", "Practicó responder preguntas comunes en voz alta frente a un espejo."], ["She also recorded herself on her phone to check her pronunciation.", "También se grabó con su teléfono para revisar su pronunciación."], ["On the day of the interview, her hands were shaking a little.", "El día de la entrevista, le temblaban un poco las manos."], ["The interviewer was kind and asked her to describe a difficult situation at work.", "La entrevistadora fue amable y le pidió describir una situación difícil en el trabajo."], ["Elena told a story about a project that was late and how her team solved the problem.", "Elena contó una historia sobre un proyecto que iba retrasado y cómo su equipo resolvió el problema."], ["She made a few mistakes, but she kept talking and didn't give up.", "Cometió algunos errores, pero siguió hablando y no se rindió."], ["A week later, the company called her with good news: she got the job.", "Una semana después, la empresa la llamó con buenas noticias: obtuvo el trabajo."]], "glossary": {"had been looking for": "llevaba buscando", "looking for": "buscando", "job": "trabajo, empleo", "months": "meses", "received": "recibió", "email": "correo electrónico", "international": "internacional", "company": "empresa, compañía", "wanted": "querían", "interview": "entrevista / entrevistar", "would": "(condicional) sería", "felt": "se sintió", "excited": "emocionada", "afraid": "con miedo", "hadn't spoken": "no había hablado", "spoken": "hablado", "decided": "decidió", "prepare": "prepararse", "weeks": "semanas", "practiced": "practicó", "answering": "respondiendo", "common": "común", "out loud": "en voz alta", "loud": "fuerte (sonido)", "in front of": "frente a", "mirror": "espejo", "recorded": "grabó", "herself": "a sí misma", "pronunciation": "pronunciación", "hands": "manos", "shaking": "temblando", "a little": "un poco", "interviewer": "entrevistador(a)", "kind": "amable", "describe": "describir", "difficult": "difícil", "situation": "situación", "told": "contó, dijo", "story": "historia", "project": "proyecto", "team": "equipo", "solved": "resolvió", "made": "hizo / cometió", "mistakes": "errores", "few": "pocos", "kept": "siguió (keep = seguir)", "talking": "hablando", "give up": "rendirse", "news": "noticias", "got": "consiguió, obtuvo"}, "questions": [{"q": "Why was Elena afraid?", "o": ["She didn't like the company", "She hadn't spoken English in years", "The interview was very far away"], "a": 1}, {"q": "How did she check her pronunciation?", "o": ["She recorded herself on her phone", "She took a class", "She asked a friend"], "a": 0}, {"q": "What story did Elena tell in the interview?", "o": ["About her family", "About a late project her team solved", "About her last vacation"], "a": 1}, {"q": "What did Elena do when she made mistakes?", "o": ["She stopped talking", "She switched to Spanish", "She kept talking and didn't give up"], "a": 2}]}, {"id": "b1-wrong-bus", "level": "B1", "topic": "Viajes", "title": "The Wrong Bus", "title_es": "El autobús equivocado", "text": [["Last summer, Daniel traveled alone to Chicago for a training course.", "El verano pasado, Daniel viajó solo a Chicago para un curso de capacitación."], ["On his first morning, he wanted to take the bus from the hotel to the training center.", "Su primera mañana, quiso tomar el autobús del hotel al centro de capacitación."], ["He was in a hurry, so he got on the first bus that stopped.", "Tenía prisa, así que se subió al primer autobús que se detuvo."], ["After twenty minutes, he realized that the streets looked completely different from the map.", "Después de veinte minutos, se dio cuenta de que las calles se veían completamente distintas al mapa."], ["He felt a little embarrassed, but he decided to ask the driver for help.", "Se sintió un poco avergonzado, pero decidió pedirle ayuda al conductor."], ["\"Excuse me, does this bus go to the convention center?\" he asked.", "\"Disculpe, ¿este autobús va al centro de convenciones?\", preguntó."], ["The driver laughed and said, \"I'm afraid you're going in the opposite direction.\"", "El conductor se rió y dijo: \"Me temo que va en la dirección contraria\"."], ["She told him to get off at the next stop and take bus number twelve.", "Le dijo que se bajara en la siguiente parada y tomara el autobús número doce."], ["A woman sitting nearby offered to show him the right stop.", "Una mujer sentada cerca se ofreció a mostrarle la parada correcta."], ["While they waited, they talked about their jobs and their families.", "Mientras esperaban, platicaron de sus trabajos y sus familias."], ["Daniel arrived fifteen minutes late, but the instructor understood.", "Daniel llegó quince minutos tarde, pero el instructor lo entendió."], ["That night, he wrote in his notebook: \"Getting lost is a great way to practice English.\"", "Esa noche escribió en su libreta: \"Perderse es una gran manera de practicar inglés\"."]], "glossary": {"last": "pasado / último", "summer": "verano", "traveled": "viajó", "alone": "solo", "training": "capacitación", "course": "curso", "center": "centro", "in a hurry": "con prisa", "hurry": "prisa", "got on": "se subió", "stopped": "se detuvo", "realized": "se dio cuenta", "streets": "calles", "looked": "se veían", "completely": "completamente", "different": "diferente", "map": "mapa", "embarrassed": "avergonzado", "ask": "pedir / preguntar", "driver": "conductor", "help": "ayuda", "excuse me": "disculpe", "convention": "convención", "laughed": "se rió", "i'm afraid": "me temo que", "afraid": "con miedo / me temo", "opposite": "opuesto, contrario", "direction": "dirección", "get off": "bajarse", "stop": "parada", "number": "número", "woman": "mujer", "sitting": "sentada", "nearby": "cerca", "offered": "se ofreció", "right": "correcto / derecho", "talked": "platicaron", "families": "familias", "instructor": "instructor", "understood": "entendió", "wrote": "escribió", "notebook": "libreta, cuaderno", "getting lost": "perderse", "lost": "perdido", "great": "genial, excelente", "way": "manera / camino", "practice": "practicar", "wrong": "equivocado"}, "questions": [{"q": "Why did Daniel take the wrong bus?", "o": ["He was in a hurry and took the first bus", "The hotel gave him the wrong map", "The driver lied to him"], "a": 0}, {"q": "Who did Daniel ask for help first?", "o": ["A police officer", "The bus driver", "The hotel receptionist"], "a": 1}, {"q": "What did the woman sitting nearby do?", "o": ["She gave him money", "She offered to show him the right stop", "She called a taxi"], "a": 1}, {"q": "What did Daniel write in his notebook?", "o": ["That Chicago is dangerous", "That getting lost is a great way to practice English", "That buses are always late"], "a": 1}]}, {"id": "b1-cooking", "level": "B1", "topic": "Vida diaria", "title": "Learning to Cook", "title_es": "Aprendiendo a cocinar", "text": [["For years, Marco ate fast food almost every day because he didn't know how to cook.", "Durante años, Marco comió comida rápida casi todos los días porque no sabía cocinar."], ["When his doctor told him to eat healthier, he decided it was time to change.", "Cuando su doctor le dijo que comiera más sano, decidió que era momento de cambiar."], ["He bought a simple cookbook and chose an easy recipe: chicken soup.", "Compró un recetario sencillo y eligió una receta fácil: sopa de pollo."], ["His first attempt was a disaster because he added too much salt.", "Su primer intento fue un desastre porque le puso demasiada sal."], ["The second time, he forgot the soup on the stove and burned it.", "La segunda vez, olvidó la sopa en la estufa y se le quemó."], ["Instead of giving up, he started watching cooking videos in English.", "En lugar de rendirse, empezó a ver videos de cocina en inglés."], ["He learned new words like \"chop\", \"stir\" and \"simmer\", and he wrote them down.", "Aprendió palabras nuevas como \"picar\", \"revolver\" y \"cocinar a fuego lento\", y las anotó."], ["Little by little, his dishes started to taste better.", "Poco a poco, sus platillos empezaron a saber mejor."], ["After two months, he invited his friends for dinner and cooked pasta with vegetables.", "Después de dos meses, invitó a sus amigos a cenar y cocinó pasta con verduras."], ["Everybody asked for a second plate.", "Todos pidieron un segundo plato."], ["Now Marco cooks four or five times a week and feels much better.", "Ahora Marco cocina cuatro o cinco veces por semana y se siente mucho mejor."]], "glossary": {"ate": "comió", "fast food": "comida rápida", "know how to": "saber (hacer algo)", "doctor": "doctor", "healthier": "más saludable", "time": "momento / tiempo", "change": "cambiar", "bought": "compró", "simple": "sencillo", "cookbook": "recetario", "chose": "eligió", "easy": "fácil", "recipe": "receta", "soup": "sopa", "attempt": "intento", "disaster": "desastre", "added": "agregó", "too much": "demasiado", "salt": "sal", "second": "segundo", "forgot": "olvidó", "stove": "estufa", "burned": "quemó", "instead of": "en lugar de", "giving up": "rendirse", "started": "empezó", "watching": "viendo", "videos": "videos", "learned": "aprendió", "words": "palabras", "chop": "picar (en trozos)", "stir": "revolver", "simmer": "cocinar a fuego lento", "wrote them down": "las anotó", "wrote down": "anotó", "little by little": "poco a poco", "dishes": "platillos / platos", "taste": "saber (sabor)", "better": "mejor", "invited": "invitó", "cooked": "cocinó", "pasta": "pasta", "plate": "plato", "cooks": "cocina", "times": "veces", "feels": "se siente", "much": "mucho"}, "questions": [{"q": "Why did Marco decide to learn to cook?", "o": ["His doctor told him to eat healthier", "He lost his job", "His friends asked him"], "a": 0}, {"q": "What went wrong the first time?", "o": ["He burned the soup", "He added too much salt", "He forgot the chicken"], "a": 1}, {"q": "How did he learn new cooking words?", "o": ["In a cooking class", "By watching cooking videos in English", "From his mother"], "a": 1}, {"q": "What did Marco cook for his friends?", "o": ["Chicken soup", "Tacos", "Pasta with vegetables"], "a": 2}]}, {"id": "b2-audit", "level": "B2", "topic": "Trabajo", "title": "The Audit", "title_es": "La auditoría", "text": [["The external auditors were scheduled to arrive on Monday, and the whole maintenance team was under pressure.", "Los auditores externos debían llegar el lunes, y todo el equipo de mantenimiento estaba bajo presión."], ["Patricia, the quality coordinator, had spent the previous week reviewing every procedure and record.", "Patricia, la coordinadora de calidad, había pasado la semana anterior revisando cada procedimiento y registro."], ["Despite her efforts, she had a feeling that something important had been overlooked.", "A pesar de sus esfuerzos, tenía la sensación de que se había pasado por alto algo importante."], ["On the second day of the audit, one of the auditors asked to see the calibration certificates for the pressure gauges.", "El segundo día de la auditoría, uno de los auditores pidió ver los certificados de calibración de los manómetros."], ["Most of them were up to date, but two had expired three weeks earlier.", "La mayoría estaban vigentes, pero dos habían vencido tres semanas antes."], ["Patricia didn't try to hide the problem or make excuses.", "Patricia no intentó ocultar el problema ni poner pretextos."], ["Instead, she explained how the gauges were used and what risk the expired certificates represented.", "En cambio, explicó cómo se usaban los manómetros y qué riesgo representaban los certificados vencidos."], ["The auditor registered a minor finding and asked for a corrective action plan within thirty days.", "El auditor registró un hallazgo menor y pidió un plan de acción correctiva en un plazo de treinta días."], ["Back at her desk, Patricia analyzed the root cause rather than simply blaming the technician responsible.", "De regreso en su escritorio, Patricia analizó la causa raíz en lugar de simplemente culpar al técnico responsable."], ["She discovered that the calibration schedule depended on a spreadsheet that nobody reviewed regularly.", "Descubrió que el programa de calibración dependía de una hoja de cálculo que nadie revisaba con regularidad."], ["Her proposal was to set up automatic reminders and assign a backup person for every critical task.", "Su propuesta fue configurar recordatorios automáticos y asignar a una persona de respaldo para cada tarea crítica."], ["When the auditors returned six months later, the system was working flawlessly, and the finding was closed.", "Cuando los auditores regresaron seis meses después, el sistema funcionaba perfectamente y el hallazgo se cerró."], ["Patricia learned that an audit is not a test you pass or fail, but an opportunity to improve.", "Patricia aprendió que una auditoría no es un examen que se aprueba o se reprueba, sino una oportunidad para mejorar."]], "glossary": {"external": "externo", "auditors": "auditores", "scheduled": "programado", "whole": "todo, completo", "under pressure": "bajo presión", "pressure": "presión", "quality": "calidad", "coordinator": "coordinador(a)", "had spent": "había pasado", "spent": "pasó (tiempo)", "previous": "anterior", "reviewing": "revisando", "record": "registro", "despite": "a pesar de", "efforts": "esfuerzos", "feeling": "sensación", "overlooked": "pasado por alto", "audit": "auditoría", "calibration": "calibración", "certificates": "certificados", "gauges": "medidores", "pressure gauges": "manómetros", "most": "la mayoría", "up to date": "vigente, al día", "expired": "vencido", "earlier": "antes", "hide": "ocultar", "make excuses": "poner pretextos", "excuses": "excusas, pretextos", "instead": "en cambio", "risk": "riesgo", "represented": "representaban", "registered": "registró", "minor": "menor", "finding": "hallazgo", "corrective": "correctivo", "action": "acción", "within": "dentro de, en un plazo de", "desk": "escritorio", "analyzed": "analizó", "root cause": "causa raíz", "cause": "causa", "rather than": "en lugar de", "simply": "simplemente", "blaming": "culpar", "responsible": "responsable", "discovered": "descubrió", "schedule": "programa, calendario", "depended on": "dependía de", "spreadsheet": "hoja de cálculo", "regularly": "con regularidad", "proposal": "propuesta", "set up": "configurar, establecer", "automatic": "automático", "reminders": "recordatorios", "assign": "asignar", "backup": "respaldo", "critical": "crítico", "task": "tarea", "returned": "regresaron", "flawlessly": "perfectamente, sin fallas", "closed": "cerrado", "test": "examen, prueba", "pass": "aprobar", "fail": "reprobar, fallar", "opportunity": "oportunidad", "improve": "mejorar", "important": "importante", "something": "algo"}, "questions": [{"q": "What problem did the auditor find?", "o": ["Two calibration certificates had expired", "A machine was unsafe", "The team had no procedures"], "a": 0}, {"q": "How did Patricia react during the audit?", "o": ["She blamed a technician", "She explained the risk honestly without making excuses", "She asked the auditors to leave"], "a": 1}, {"q": "What was the root cause of the problem?", "o": ["The gauges were broken", "A spreadsheet nobody reviewed regularly", "The auditors made a mistake"], "a": 1}, {"q": "What lesson did Patricia learn?", "o": ["Audits are a waste of time", "An audit is an opportunity to improve", "Technicians must be punished"], "a": 1}]}, {"id": "b2-letter", "level": "B2", "topic": "Historia", "title": "The Old Letter", "title_es": "La carta antigua", "text": [["When Sofia's grandmother passed away, the family gathered at her house to sort through her belongings.", "Cuando la abuela de Sofía falleció, la familia se reunió en su casa para revisar sus pertenencias."], ["In the back of a wardrobe, Sofia came across a wooden box that nobody had ever mentioned.", "En el fondo de un ropero, Sofía encontró por casualidad una caja de madera que nadie había mencionado nunca."], ["Inside, there was a bundle of letters written in English, tied with a faded blue ribbon.", "Adentro había un paquete de cartas escritas en inglés, atadas con un listón azul desteñido."], ["Her grandmother had never told anyone that she spoke English.", "Su abuela nunca le había dicho a nadie que hablaba inglés."], ["Curious, Sofia opened the first letter, dated 1962, and started to read slowly with a dictionary.", "Con curiosidad, Sofía abrió la primera carta, fechada en 1962, y empezó a leer despacio con un diccionario."], ["The letters had been sent by a young engineer from Canada who had worked in their town for a year.", "Las cartas las había enviado un joven ingeniero de Canadá que había trabajado en su pueblo durante un año."], ["He described long walks by the river and promised to return as soon as his contract ended.", "Describía largas caminatas junto al río y prometía regresar en cuanto terminara su contrato."], ["The last letter, however, was very different: he apologized for not keeping his promise.", "Sin embargo, la última carta era muy diferente: se disculpaba por no cumplir su promesa."], ["His father had fallen ill, and he had to stay in Canada to take care of the family business.", "Su padre había enfermado y él tuvo que quedarse en Canadá para hacerse cargo del negocio familiar."], ["Sofia realized that this was the reason her grandmother had always encouraged her to study languages.", "Sofía se dio cuenta de que esa era la razón por la que su abuela siempre la había animado a estudiar idiomas."], ["That night, she decided to write her own letter in English, addressed to no one in particular.", "Esa noche, decidió escribir su propia carta en inglés, dirigida a nadie en particular."], ["She simply wanted to finish the conversation her grandmother had never been able to finish.", "Simplemente quería terminar la conversación que su abuela nunca había podido terminar."]], "glossary": {"grandmother": "abuela", "passed away": "falleció", "gathered": "se reunió", "sort through": "revisar y ordenar", "belongings": "pertenencias", "wardrobe": "ropero, clóset", "came across": "encontró por casualidad", "wooden": "de madera", "box": "caja", "had ever mentioned": "había mencionado alguna vez", "mentioned": "mencionado", "inside": "adentro", "bundle": "paquete, fajo", "letters": "cartas", "written": "escritas", "tied": "atadas", "faded": "desteñido", "ribbon": "listón", "anyone": "nadie / cualquiera", "spoke": "hablaba", "curious": "con curiosidad", "dated": "fechada", "slowly": "despacio", "dictionary": "diccionario", "had been sent": "habían sido enviadas", "sent": "enviado", "young": "joven", "engineer": "ingeniero", "worked": "trabajado", "described": "describía", "walks": "caminatas", "river": "río", "promised": "prometió", "return": "regresar", "as soon as": "en cuanto", "contract": "contrato", "ended": "terminó", "however": "sin embargo", "apologized": "se disculpó", "keeping": "cumplir, mantener", "promise": "promesa", "had fallen ill": "había enfermado", "ill": "enfermo", "stay": "quedarse", "take care of": "cuidar, hacerse cargo de", "business": "negocio", "realized": "se dio cuenta", "reason": "razón", "encouraged": "animó, alentó", "languages": "idiomas", "own": "propio", "addressed": "dirigida", "no one": "nadie", "in particular": "en particular", "finish": "terminar", "conversation": "conversación", "been able to": "podido", "father": "padre", "old": "viejo, antiguo"}, "questions": [{"q": "Where did Sofia find the box?", "o": ["Under the bed", "In the back of a wardrobe", "In the garden"], "a": 1}, {"q": "Who wrote the letters?", "o": ["Sofia's grandfather", "A young engineer from Canada", "A teacher from England"], "a": 1}, {"q": "Why didn't the engineer return?", "o": ["He married someone else", "His father fell ill and he had to stay", "He lost his job"], "a": 1}, {"q": "What did Sofia decide to do that night?", "o": ["Burn the letters", "Travel to Canada", "Write her own letter in English"], "a": 2}]}, {"id": "b2-home-office", "level": "B2", "topic": "Opinión", "title": "Working from Home: Two Points of View", "title_es": "Trabajo desde casa: dos puntos de vista", "text": [["When the company announced that employees could work from home three days a week, opinions were divided.", "Cuando la empresa anunció que los empleados podían trabajar desde casa tres días a la semana, las opiniones se dividieron."], ["Karen, an accountant, was thrilled because she would save almost two hours of commuting every day.", "Karen, contadora, estaba encantada porque se ahorraría casi dos horas de traslado cada día."], ["She argued that fewer interruptions would allow her to concentrate on complex reports.", "Argumentaba que menos interrupciones le permitirían concentrarse en reportes complejos."], ["Miguel, on the other hand, was concerned about losing contact with his team.", "Miguel, en cambio, estaba preocupado por perder el contacto con su equipo."], ["As a production engineer, he believed that many problems are solved faster face to face.", "Como ingeniero de producción, creía que muchos problemas se resuelven más rápido en persona."], ["After a few months, both of them had changed their minds slightly.", "Después de unos meses, ambos habían cambiado un poco de opinión."], ["Karen admitted that she sometimes felt isolated and missed chatting with her colleagues.", "Karen admitió que a veces se sentía aislada y extrañaba platicar con sus colegas."], ["Miguel discovered that remote meetings were more efficient when they had a clear agenda.", "Miguel descubrió que las reuniones remotas eran más eficientes cuando tenían una agenda clara."], ["Eventually, the team agreed on a hybrid routine that worked for most people.", "Finalmente, el equipo acordó una rutina híbrida que funcionaba para la mayoría."], ["Tasks that required concentration were done at home, while planning and problem-solving happened in the office.", "Las tareas que requerían concentración se hacían en casa, mientras que la planeación y la solución de problemas ocurrían en la oficina."], ["The experience showed them that the best solution is rarely all or nothing.", "La experiencia les mostró que la mejor solución rara vez es todo o nada."]], "glossary": {"announced": "anunció", "employees": "empleados", "opinions": "opiniones", "divided": "divididas", "accountant": "contador(a)", "thrilled": "encantado, feliz", "save": "ahorrar", "commuting": "trasladarse al trabajo", "argued": "argumentó", "fewer": "menos (contables)", "interruptions": "interrupciones", "allow": "permitir", "concentrate": "concentrarse", "complex": "complejo", "on the other hand": "por otro lado, en cambio", "concerned": "preocupado", "losing": "perder", "contact": "contacto", "believed": "creía", "solved": "resueltos", "faster": "más rápido", "face to face": "en persona, cara a cara", "both": "ambos", "changed their minds": "cambiaron de opinión", "minds": "mentes / opiniones", "slightly": "ligeramente, un poco", "admitted": "admitió", "sometimes": "a veces", "isolated": "aislado", "missed": "extrañaba", "chatting": "platicar", "colleagues": "colegas", "remote": "remoto", "meetings": "reuniones", "efficient": "eficiente", "clear": "claro", "agenda": "agenda, orden del día", "eventually": "finalmente, con el tiempo", "agreed on": "acordaron", "hybrid": "híbrido", "routine": "rutina", "required": "requerían", "concentration": "concentración", "planning": "planeación", "problem-solving": "solución de problemas", "happened": "ocurrían", "experience": "experiencia", "showed": "mostró", "solution": "solución", "rarely": "rara vez", "all or nothing": "todo o nada", "point of view": "punto de vista", "points": "puntos", "view": "vista, opinión"}, "questions": [{"q": "Why was Karen happy at first?", "o": ["She would earn more money", "She would save almost two hours of commuting", "She could travel more"], "a": 1}, {"q": "What was Miguel worried about?", "o": ["Losing contact with his team", "Using new software", "Working too many hours"], "a": 0}, {"q": "What did Miguel discover about remote meetings?", "o": ["They are always a waste of time", "They work better with a clear agenda", "They should be longer"], "a": 1}, {"q": "What is the main idea of the text?", "o": ["Working from home is always better", "Offices are necessary every day", "The best solution is rarely all or nothing"], "a": 2}]}, {"id": "b2-presentation", "level": "B2", "topic": "Trabajo", "title": "The Presentation", "title_es": "La presentación", "text": [["Andrés had been asked to present the results of his energy-saving project to the regional directors, in English.", "A Andrés le pidieron presentar los resultados de su proyecto de ahorro de energía a los directores regionales, en inglés."], ["Although his technical knowledge was solid, the idea of speaking in front of senior managers kept him awake at night.", "Aunque su conocimiento técnico era sólido, la idea de hablar frente a directivos lo mantenía despierto por las noches."], ["A colleague gave him valuable advice: \"Don't memorize every word; tell the story behind the numbers.\"", "Un colega le dio un consejo valioso: \"No memorices cada palabra; cuenta la historia detrás de los números\"."], ["So Andrés structured his presentation around three questions: what was the problem, what did we do, and what did we achieve?", "Así que Andrés estructuró su presentación en torno a tres preguntas: ¿cuál era el problema, qué hicimos y qué logramos?"], ["He replaced long paragraphs on his slides with simple charts and a few key figures.", "Reemplazó los párrafos largos de sus diapositivas con gráficas sencillas y algunas cifras clave."], ["He also rehearsed in front of his family, who did not understand English but noticed when he spoke too fast.", "También ensayó frente a su familia, que no entendía inglés pero notaba cuando hablaba demasiado rápido."], ["On the day of the presentation, his voice trembled during the first minute.", "El día de la presentación, su voz tembló durante el primer minuto."], ["Then he showed a photo of the old compressors and explained how much energy they had been wasting.", "Luego mostró una foto de los compresores viejos y explicó cuánta energía habían estado desperdiciando."], ["The directors started asking questions, and Andrés realized he knew the answers better than anyone in the room.", "Los directores empezaron a hacer preguntas y Andrés se dio cuenta de que sabía las respuestas mejor que nadie en la sala."], ["When one director asked a question he didn't understand, he calmly asked her to rephrase it.", "Cuando una directora hizo una pregunta que no entendió, con calma le pidió que la reformulara."], ["At the end, the regional director congratulated him and approved the budget to extend the project to two other plants.", "Al final, el director regional lo felicitó y aprobó el presupuesto para extender el proyecto a otras dos plantas."], ["Andrés understood that confidence does not come from perfect English, but from knowing your message.", "Andrés entendió que la confianza no viene de un inglés perfecto, sino de conocer tu mensaje."]], "glossary": {"had been asked": "le habían pedido", "present": "presentar", "results": "resultados", "energy-saving": "ahorro de energía", "energy": "energía", "regional": "regional", "directors": "directores", "although": "aunque", "technical": "técnico", "knowledge": "conocimiento", "solid": "sólido", "senior managers": "altos directivos", "senior": "de alto nivel", "kept him awake": "lo mantenía despierto", "awake": "despierto", "valuable": "valioso", "advice": "consejo", "memorize": "memorizar", "behind": "detrás de", "numbers": "números", "structured": "estructuró", "around": "en torno a", "achieve": "lograr", "paragraphs": "párrafos", "slides": "diapositivas", "charts": "gráficas", "key": "clave", "figures": "cifras", "rehearsed": "ensayó", " const lw=w=>String(w).toLowerCase().replace(/[’‘]/g,"'");
function wordForms(w){const f=[w];if(w.endsWith("'s"))f.push(w.slice(0,-2));
  if(w.endsWith('ies'))f.push(w.slice(0,-3)+'y');if(w.endsWith('es'))f.push(w.slice(0,-2));if(w.endsWith('s'))f.push(w.slice(0,-1));
  if(w.endsWith('ied'))f.push(w.slice(0,-3)+'y');if(w.endsWith('ed')){f.push(w.slice(0,-2));f.push(w.slice(0,-1));if(/(.)\1ed$/.test(w))f.push(w.slice(0,-3))}
  if(w.endsWith('ing')){f.push(w.slice(0,-3));f.push(w.slice(0,-3)+'e');if(/(.)\1ing$/.test(w))f.push(w.slice(0,-4))}
  if(w.endsWith('ly'))f.push(w.slice(0,-2));if(w.endsWith('er'))f.push(w.slice(0,-2));return uniq(f)}
function vocabMap(){if(vocabMap.m!==undefined)return vocabMap.m;const items=LIB.vocab;if(!items){return null}const m={};items.forEach(x=>{x.en.split(' / ').forEach(e=>{const k=lw(e.replace(/\([^)]*\)/g,'').trim());if(k&&!m[k])m[k]=x.es})});return vocabMap.m=m}
function lookup(word,si,wi){
  const D=READ,toks=D.sent[si].en.match(/[A-Za-z][A-Za-z'’\-]*/g).map(lw),out={phrases:[],word:null};
  const dicts=[[D.gloss,'Glosario de la lectura'],[GLOBAL_GLOSS,'Glosario de historias'],[vocabMap()||{},'Tus ladrillos'],[COMMON_ES,'Palabras frecuentes']];
  // frases (2–4 palabras) que incluyen la palabra tocada
  const seen=new Set();
  for(let n=4;n>=2;n--)for(let a=Math.max(0,wi-n+1);a<=wi&&a+n<=toks.length;a++){const ph=toks.slice(a,a+n).join(' ');
    for(const [d,src] of dicts.slice(0,2)){if(d[ph]&&!seen.has(ph)){seen.add(ph);out.phrases.push({k:ph,v:d[ph],src})}}}
  const w=lw(word);
  outer:for(const f of wordForms(w))for(const [d,src] of dicts){if(d[f]){out.word={k:f,v:d[f],src};break outer}}
  return out;
}
function openWord(el){
  document.querySelectorAll('.tw.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
  const si=+el.dataset.s,wi=+el.dataset.w,word=el.textContent;
  const r=lookup(word,si,wi);
  const proper=/^[A-Z]/.test(word)&&word.length>1&&!r.word&&!r.phrases.length;
  showWordPop(el,{word,si,r,proper});
}
function selLookup(){
  const sel=window.getSelection();if(!sel||sel.isCollapsed)return;const txt=String(sel).trim().replace(/\s+/g,' ');
  if(!txt||txt.split(' ').length<2||txt.split(' ').length>6)return;
  const node=sel.anchorNode&&(sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement);const rs=node&&node.closest('.rs');if(!rs)return;
  const si=+rs.id.slice(2),k=lw(txt.replace(/[.,!?;:"“”]/g,'').trim());
  const hit=READ.gloss[k]||GLOBAL_GLOSS[k];
  const range=sel.getRangeAt(0),anchor=range.getBoundingClientRect();
  showWordPop(null,{word:txt.replace(/[.,!?;:"“”]+$/,''),si,r:{phrases:hit?[{k,v:hit,src:'Glosario'}]:[],word:null},rect:anchor,phrase:true});
}

  ${o.r.phrases.map(p=>`<div class="wp-m"><span class="badge vio">frase</span> <b>${h(p.k)}</b>: ${h(p.v)}</div>`).join('')}
  ${o.r.word?`<div class="wp-m"><b>${h(o.r.word.v)}</b>${o.r.word.k!==lw(o.word)?` <span class="muted">(de <i>${h(o.r.word.k)}</i>)</span>`:''}<div class="muted" style="font-size:12px">${h(o.r.word.src)}</div></div>`:''}
  ${!found&&o.proper?`<div class="wp-m">Nombre propio (persona o lugar).</div>`:''}
  ${!found&&!o.proper?`<div class="wp-m muted">No está en los glosarios.</div>`:''}
  <div id="wpAI"></div>

  <div class="row mt8"><button class="secondary small" onclick="wordAI(${JSON.stringify(o.word).replace(/"/g,'&quot;')},${o.si})">🤖 Explicar en contexto</button><button class="ghost small" onclick="wordSave(${JSON.stringify(o.word).replace(/"/g,'&quot;')},${o.si})">⭐ Guardar en Repaso</button></div>`;
  document.body.appendChild(p);
  if(window.innerWidth>700){const rc=o.rect||el.getBoundingClientRect();const w=360;let left=Math.min(window.innerWidth-w-12,Math.max(12,rc.left+rc.width/2-w/2));let top=rc.bottom+8;
    p.style.width=w+'px';p.style.left=left+'px';p.style.top=(top+window.scrollY)+'px';p.style.position='absolute';
    const ph=p.offsetHeight;if(rc.bottom+ph+16>window.innerHeight&&rc.top-ph-8>0)p.style.top=(rc.top-ph-8+window.scrollY)+'px'}
  if(!found&&!o.proper&&!DEMO)wordAI(o.word,o.si);
}
async function wordAI(word,si){

function demoCorrections(t){const out=[],tx=String(t);
  const rules=[[/\bi\b/,'i','I','"I" (yo) siempre va con mayúscula.'],[/\b(he|she|it) don'?t\b/i,null,null,'Con he, she, it se usa "doesn\'t".'],[/\bpeople is\b/i,'people is','people are','"People" es plural: people are.'],[/\bI have (\d+) years\b/i,null,null,'La edad se dice con "be": I am … years old.'],[/\bmore better\b/i,'more better','better','"Better" ya es comparativo; no lleva "more".'],[/\bexplain me\b/i,'explain me','explain to me','Se dice "explain something to someone".']];

    case 'getLibrary':{need();return {ok:true,tipo:a[1],items:demoLibRows().filter(x=>x.tipo===a[1]).map(x=>({...x}))}}

    case 'checkTranslation':{need();const pl=a[1]||{},sc=align(pl.solution||'',pl.answer||'').score;return {ok:true,correct:sc>=70,score:sc,better:pl.solution,why_es:sc>=70?'':'(Demostración) Compara tu versión con la solución. Con la IA real recibirás una explicación de cada error.',reference_issue_es:''}}
    case 'saveLibraryPractice':{need();const pl=a[1]||{},p=demoProg(db,u),tot=Number(pl.total)||0,ok=Number(pl.correct)||0;if(!tot)return {ok:false,message:'No hay resultados que guardar.'};const sc=Math.round(ok/tot*100),xp=Math.min(60,10+ok*2);p.xp+=xp;p.minutes+=Number(pl.minutes)||1;demoTouch(p);demoLog(db,u,'library',Number(pl.minutes)||1,sc,{tipo:pl.tipo,grupo:pl.grupo});db.libp=db.libp||{};db.libp[u]=db.libp[u]||{};const k='lib:'+pl.tipo+':'+pl.grupo;db.libp[u][k]={status:'completed',bestScore:Math.max(sc,(db.libp[u][k]||{}).bestScore||0),attempts:((db.libp[u][k]||{}).attempts||0)+1};out={ok:true,xp,score:sc,bootstrap:demoBoot(db,u)};break}
    case 'adminSetTrack':{need();if(db.users[a[1]])db.users[a[1]].track=a[2];out={ok:true,message:'Ruta actualizada.'};break}
    case 'adminResetPassword':{need();if(db.users[a[1]])db.users[a[1]].password=a[2];out={ok:true,message:'Contraseña actualizada.'};break}
    default:return {ok:false,message:'Función no disponible en demo: '+fn};
  }
  saveDB(db);return out;
}
