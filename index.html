<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>English 365 Academy</title>
<style>
:root{--bg:#07111f;--panel:#0e1b2c;--card:#14243a;--line:#2b405e;--txt:#f8fafc;--muted:#9fb0c6;--accent:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--vio:#8b5cf6;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#07111f,#10223b);color:var(--txt)}button,input,select{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card,.card{background:#0e1b2cf5;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 50px #0003}.login-card{width:min(560px,100%)}
.brand{display:flex;gap:14px;align-items:center}.logo{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,var(--accent),#2563eb);display:grid;place-items:center;font-weight:900;font-size:20px}h1,h2,h3{margin:.35em 0}p{color:#cbd5e1;line-height:1.5}label{display:block;color:#cbd5e1;font-size:13px;margin:12px 0 5px}input,select{width:100%;padding:11px;border:1px solid #334b69;border-radius:11px;background:#07111f;color:white}
button{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#082f49}.secondary{background:#334155;color:white}.success{background:var(--ok);color:#052e16}.ghost{background:transparent;border:1px solid #40536d;color:#dbeafe}.danger{background:#7f1d1d;color:white}.small{padding:7px 9px;font-size:12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.top{position:sticky;top:0;z-index:20;background:#07111feb;border-bottom:1px solid #24354e;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(10px)}.top .logo{width:38px;height:38px;border-radius:10px;font-size:13px}.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 61px)}aside{background:#091525c9;border-right:1px solid #24354e;padding:14px;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto}.nav{width:100%;text-align:left;background:transparent;color:#cbd5e1;margin:3px 0}.nav.active,.nav:hover{background:#1d2d45}main{padding:20px;max-width:1500px;width:100%}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(5,1fr)}.modules{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr 1fr}.stat strong{display:block;font-size:28px;margin:4px 0}.muted{color:var(--muted)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#164e63;color:#cffafe;font-size:12px;font-weight:800}.badge.ok{background:#14532d;color:#dcfce7}.badge.warn{background:#78350f;color:#fef3c7}.badge.vio{background:#4c1d95;color:#ede9fe}
.progress{height:10px;border-radius:99px;background:#07111f;overflow:hidden;border:1px solid #2c415f}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok))}.skill{display:grid;grid-template-columns:120px 1fr 50px;gap:9px;align-items:center;margin:11px 0}.lesson{padding:11px;border:1px solid #334b69;border-radius:11px;background:#0a1627;margin:8px 0}.phrase{font-size:25px;font-weight:850;margin:14px 0}.phon{color:#7dd3fc}.notice{border-left:4px solid var(--accent);background:#0a1627;padding:12px;border-radius:10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #30435d;text-align:left}.xp{font-size:42px;font-weight:900}.toast{position:fixed;right:18px;bottom:18px;background:#111827;border:1px solid #334155;padding:12px 16px;border-radius:12px;z-index:99;box-shadow:0 12px 30px #0007}.choice{width:100%;text-align:left;background:#0a1627;color:white;border:1px solid #334b69;margin:4px 0}.choice.correct{border-color:var(--ok);background:#052e16}.choice.wrong{border-color:var(--danger);background:#450a0a}.loading{opacity:.55;pointer-events:none}
@media(max-width:1000px){.layout{grid-template-columns:1fr}aside{display:none}.stats,.modules,.split{grid-template-columns:1fr 1fr}}@media(max-width:680px){.stats,.modules,.split{grid-template-columns:1fr}.skill{grid-template-columns:105px 1fr 44px}main{padding:13px}.top .desktop{display:none}}
</style>
</head>
<body>
<section id="loginView" class="login"><div class="login-card">
<div class="brand"><div class="logo">E365</div><div><h1>English 365 Academy</h1><div class="muted">V3.2.1 · Google Apps Script</div></div></div>
<p>Inicio de sesión conectado directamente a Google Sheets.</p>
<label>Usuario</label><input id="loginUser" value="demo" autocomplete="username">
<label>Contraseña</label><input id="loginPass" type="password" value="english365" autocomplete="current-password">
<div class="row" style="margin-top:16px"><button class="primary" onclick="login()">Entrar</button></div>
<p class="muted" style="font-size:12px">Alumno: <b>demo / english365</b> · Profesor: <b>teacher / teacher365</b> · Admin: <b>admin / admin365</b></p>
<div id="loginMsg"></div>
</div></section>

<section id="appView" class="hidden"><header class="top"><div class="brand"><div class="logo">E365</div><b>English 365 Academy</b></div><div class="row"><span id="roleChip" class="badge"></span><span id="trackChip" class="badge vio desktop"></span><button class="danger small" onclick="logout()">Salir</button></div></header>
<div class="layout"><aside>
<button class="nav active" data-p="home" onclick="go('home')">🏠 Inicio</button>
<button class="nav" data-p="today" onclick="go('today')">▶ Sesión de hoy</button>
<button class="nav" data-p="skills" onclick="go('skills')">🎯 Mis habilidades</button>
<button class="nav" data-p="route" onclick="go('route')">📅 Ruta 52 semanas</button>
<button class="nav" data-p="modules" onclick="go('modules')">📚 Módulos</button>
<button class="nav" data-p="speak" onclick="go('speak')">🎙 Speak Challenge</button>
<button class="nav" data-p="review" onclick="go('review')">🧠 Repaso inteligente</button>
<button class="nav" data-p="weekly" onclick="go('weekly')">🏆 Weekly Challenge</button>
<button class="nav" data-p="achievements" onclick="go('achievements')">⭐ XP y logros</button>
<div id="teacherNav" class="hidden"><hr style="border-color:#334b69"><button class="nav" data-p="teacher" onclick="go('teacher')">👨‍🏫 Panel docente</button></div>
<div id="adminNav" class="hidden"><button class="nav" data-p="admin" onclick="go('admin')">🛡 Administración</button></div>
</aside><main id="main"></main></div></section>
<div id="toast" class="toast hidden"></div>
<script>
const TRACKS={adult:{name:'Adulto / Profesional',minutes:30,goal:'A2 → B1 funcional'},university:{name:'Universitario básico',minutes:30,goal:'A2 sólido → puente B1'},kids:{name:'Niños 10–12',minutes:18,goal:'Base A1 oral y comprensiva'},teens:{name:'Adolescentes 13–17',minutes:25,goal:'A1/A2 funcional'}};
const COURSES={
adult:[
 {week:1,title:'Introductions & Daily English',phrases:[["Hi, how are you?","jai, jau ar yu?","Hola, ¿cómo estás?"],["I'm from Mexico.","aim from méksiko","Soy de México."],["I usually wake up early.","ai yúshuali ueik ap érli","Normalmente me despierto temprano."],["Could you repeat that?","kud yu ripít dat?","¿Podrías repetir eso?"],["I'll check it and let you know.","ail chek it and let yu nou","Lo revisaré y te aviso."]],question:"Tell me about yourself.",model:"I'm from Mexico. I work in Facilities, and I'm improving my English."},
 {week:2,title:'Work Status & Meetings',phrases:[["What's the status of the repair?","juats de stéirus ov de ripér","¿Cuál es el estatus de la reparación?"],["We have three open issues.","ui jav zri óupen íshus","Tenemos tres asuntos abiertos."],["We need to close this today.","ui nid tu clous dis tudéi","Necesitamos cerrar esto hoy."],["Who is responsible for this?","ju is rispónsabol for dis","¿Quién es responsable de esto?"],["It should be finished this afternoon.","it shud bi fínisht dis afternún","Debería quedar terminado esta tarde."]],question:"What are today's priorities?",model:"We have three priorities today. We need to close the main repair first."},
 {week:3,title:'Safety & Quality',phrases:[["Please lock out the equipment.","plis lok aut di ikuípment","Por favor bloquea el equipo."],["We need to verify the energy sources.","ui nid tu vérifai di éneryi sórsis","Necesitamos verificar las fuentes de energía."],["The inspection is complete.","di inspékshon is komplít","La inspección está completa."],["We need evidence for the audit.","ui nid évidence for di ódit","Necesitamos evidencia para la auditoría."],["This finding needs corrective action.","dis fáinding nids koréktiv ákshon","Este hallazgo necesita acción correctiva."]],question:"Is the audit evidence ready?",model:"Yes. The document has been updated and the evidence is ready."},
 {week:4,title:'Suppliers & Reporting',phrases:[["Please send the quotation today.","plis send de kuotéishon tudéi","Por favor envía la cotización hoy."],["We need a delivery date.","ui nid a dilíveri deit","Necesitamos una fecha de entrega."],["Can you confirm the schedule?","kan yu konfírm de skédyul","¿Puedes confirmar el programa?"],["Here is today's summary.","jir is tudéis sámari","Aquí está el resumen de hoy."],["Two items are still pending.","tu áitems ar stil pénding","Dos puntos siguen pendientes."]],question:"When will the supplier arrive?",model:"The supplier will arrive at ten. I'll confirm the schedule."}
],
university:[
 {week:1,title:'Campus Survival',phrases:[["Hi, my name is Alex.","jai, mai neim is áleks","Hola, me llamo Alex."],["I'm a university student.","aim a yunivérsiti stúdent","Soy estudiante universitario."],["What are you studying?","juat ar yu stádiing","¿Qué estás estudiando?"],["Could you repeat the instructions?","kud yu ripít di instrákshons","¿Podría repetir las instrucciones?"],["I have a question.","ai jav a kuéschon","Tengo una pregunta."]],question:"What are you studying?",model:"I'm studying engineering and I'm interested in technology."},
 {week:2,title:'University Life',phrases:[["I have class at eight.","ai jav klas at eit","Tengo clase a las ocho."],["I usually study in the library.","ai yúshuali stádi in de láibreri","Normalmente estudio en la biblioteca."],["I have an exam tomorrow.","ai jav an igsám tumórou","Tengo examen mañana."],["Let's study together.","lets stádi tugéder","Estudiemos juntos."],["I'll send you the file.","ail send yu de fail","Te enviaré el archivo."]],question:"What is your routine at university?",model:"I have class in the morning, and I usually study in the library in the afternoon."},
 {week:3,title:'Projects & Presentations',phrases:[["Today I'm going to talk about our project.","tudéi aim góuing tu tok abáut aur próyect","Hoy voy a hablar sobre nuestro proyecto."],["The main objective is...","de mein obyéktiv is","El objetivo principal es..."],["This chart shows the results.","dis chart shous de rizálts","Esta gráfica muestra los resultados."],["Let's divide the tasks.","lets diváid de tasks","Dividamos las tareas."],["Do you have any questions?","du yu jav éni kuéschons","¿Tienen alguna pregunta?"]],question:"Can you explain your project?",model:"Our project solves a real problem. My part is the presentation and data analysis."},
 {week:4,title:'Internship & Career',phrases:[["I'm looking for an internship.","aim lúking for an ínternship","Estoy buscando prácticas profesionales."],["I have experience with team projects.","ai jav ikspíriens uith tim próyects","Tengo experiencia con proyectos en equipo."],["I'm willing to learn.","aim uíling tu lern","Estoy dispuesto a aprender."],["What are the main responsibilities?","juat ar de mein risponsabílitis","¿Cuáles son las principales responsabilidades?"],["Thank you for the opportunity.","zank yu for di oportuníti","Gracias por la oportunidad."]],question:"Why do you want this internship?",model:"I want to gain experience, improve my skills, and learn from the team."}
],
kids:[
 {week:1,title:'Hello English',phrases:[["Hi! My name is Sam.","jai, mai neim is sam","¡Hola! Me llamo Sam."],["What's your name?","juats yor neim","¿Cómo te llamas?"],["I'm ten years old.","aim ten yirs old","Tengo diez años."],["How are you?","jau ar yu","¿Cómo estás?"],["I'm great!","aim greit","¡Estoy muy bien!"]],question:"What's your name and how are you?",model:"My name is Sam. I'm great!"},
 {week:2,title:'School Day',phrases:[["I go to school in the morning.","ai gou tu skul in de mórning","Voy a la escuela por la mañana."],["This is my notebook.","dis is mai nóutbuk","Este es mi cuaderno."],["Can I borrow a pencil?","kan ai bárou a pénsil","¿Me prestas un lápiz?"],["It's time for lunch.","its taim for lanch","Es hora de comer."],["See you tomorrow!","si yu tumórou","¡Nos vemos mañana!"]],question:"What's your favorite subject?",model:"My favorite subject is science because I like experiments."},
 {week:3,title:'Family & Hobbies',phrases:[["This is my family.","dis is mai fámili","Esta es mi familia."],["I have one sister.","ai jav uan síster","Tengo una hermana."],["I like soccer.","ai laik sáker","Me gusta el fútbol."],["I like music.","ai laik miúsik","Me gusta la música."],["Let's play outside.","lets plei autsáid","Vamos a jugar afuera."]],question:"What do you like after school?",model:"I like to play soccer and listen to music."},
 {week:4,title:'English Around Me',phrases:[["Where is the bathroom?","juer is de bázrum","¿Dónde está el baño?"],["I'm with my family.","aim uith mai fámili","Estoy con mi familia."],["How much is this?","jau mach is dis","¿Cuánto cuesta esto?"],["I would like water, please.","ai wud laik uórer plis","Quisiera agua, por favor."],["I need help.","ai nid jelp","Necesito ayuda."]],question:"Can you ask for help?",model:"Can you help me, please? I don't understand this part."}
],
teens:[
 {week:1,title:'Everyday English',phrases:[["Hey, I'm Alex.","jei, aim áleks","Hola, soy Alex."],["I'm in high school.","aim in jai skul","Estoy en secundaria/preparatoria."],["What are you into?","juat ar yu intu","¿Qué te gusta hacer?"],["I'm into music and gaming.","aim intu miúsik and guéiming","Me gustan la música y los videojuegos."],["Nice to meet you.","nais tu mit yu","Mucho gusto."]],question:"What are you into?",model:"I'm into music, technology, and gaming."},
 {week:2,title:'School & Life',phrases:[["I have a test tomorrow.","ai jav a test tumórou","Tengo examen mañana."],["Did you finish the homework?","did yu fínesh de jóumuork","¿Terminaste la tarea?"],["Can you explain this part?","kan yu ikspléin dis part","¿Puedes explicar esta parte?"],["Let's study after school.","lets stádi áfter skul","Estudiemos después de clases."],["I need more time.","ai nid mor taim","Necesito más tiempo."]],question:"How do you study for a test?",model:"I study after school and review my notes before the test."},
 {week:3,title:'Projects & Future',phrases:[["Let's divide the project.","lets diváid de próyect","Dividamos el proyecto."],["I'll make the presentation.","ail meik de presentéishon","Yo haré la presentación."],["Can you check my part?","kan yu chek mai part","¿Puedes revisar mi parte?"],["I'd like to study engineering.","aid laik tu stádi enyiniéring","Me gustaría estudiar ingeniería."],["English can help my future.","ínglish kan jelp mai fiúcher","El inglés puede ayudar a mi futuro."]],question:"What do you want to study?",model:"I'd like to study engineering because I'm interested in technology."},
 {week:4,title:'Travel & Conversation',phrases:[["Where is the train station?","juer is de trein stéishon","¿Dónde está la estación de tren?"],["How much is the ticket?","jau mach is de tíket","¿Cuánto cuesta el boleto?"],["I'd like a sandwich, please.","aid laik a sánduich plis","Quisiera un sándwich, por favor."],["What do you think?","juat du yu zink","¿Qué opinas?"],["Let's find another option.","lets faind anóder ópshon","Busquemos otra opción."]],question:"What are you doing this weekend?",model:"I'm hanging out with friends on Saturday, and I'm studying on Sunday."}
]};
let token=sessionStorage.getItem('e365_token')||'',B=null,currentPage='home',sessionData=null;
function rpc(fn,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[fn](...args);});}
function h(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2300)}
function setLoading(v){document.body.classList.toggle('loading',v)}
async function login(){try{setLoading(true);loginMsg.textContent='Conectando...';const r=await rpc('loginUser',loginUser.value,loginPass.value);if(!r.ok){loginMsg.textContent=r.message;return}token=r.token;sessionStorage.setItem('e365_token',token);B=r.bootstrap;showApp();}catch(e){loginMsg.textContent=e.message}finally{setLoading(false)}}
async function logout(){try{if(token)await rpc('logoutUser',token)}catch(e){}sessionStorage.removeItem('e365_token');token='';B=null;appView.classList.add('hidden');loginView.classList.remove('hidden')}
async function restore(){if(!token)return;try{const r=await rpc('getBootstrap',token);if(r.ok){B=r.bootstrap;showApp()}else sessionStorage.removeItem('e365_token')}catch(e){sessionStorage.removeItem('e365_token')}}
function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');roleChip.textContent=B.user.name+' · '+B.user.role;trackChip.textContent=TRACKS[B.user.track].name;teacherNav.classList.toggle('hidden',!['teacher','admin'].includes(B.user.role));adminNav.classList.toggle('hidden',B.user.role!=='admin');go('home')}
function go(p){currentPage=p;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===p));({home, today, skills, route, modules, speak, review, weekly, achievements, teacher, admin}[p]||home)();window.scrollTo(0,0)}
function stat(i,v,t){return `<div class="card stat"><span>${i}</span><strong>${h(v)}</strong><span class="muted">${h(t)}</span></div>`}
function skillBars(s){const names={listening:'Listening',speaking:'Speaking',vocabulary:'Vocabulary',comprehension:'Comprehension',conversation:'Conversation'};return Object.keys(names).map(k=>`<div class="skill"><span>${names[k]}</span><div class="progress"><div style="width:${Number(s[k]||0)}%"></div></div><b>${Number(s[k]||0)}</b></div>`).join('')}
function currentCourse(){const arr=COURSES[B.user.track]||COURSES.university;return arr[(Math.min(B.week,4)-1)%4]}
function home(){const t=TRACKS[B.user.track],c=currentCourse();main.innerHTML=`<h1>Hola, ${h(B.user.name)} 👋</h1><p>Ruta: <b>${h(t.name)}</b> · Meta: <b>${h(t.goal)}</b></p><div class="grid stats">${stat('⭐',B.xp,'XP')}${stat('🔥',B.streak,'Racha')}${stat('⏱',B.minutes,'Minutos')}${stat('📅','S'+B.week,'Semana')}${stat('🎯',B.level,'Nivel estimado')}</div><div class="grid split" style="margin-top:14px"><div class="card"><span class="badge">Semana ${B.week}</span><h2>${h(c.title)}</h2><p>Sesión recomendada: <b>${t.minutes} minutos</b>.</p><button class="primary" onclick="go('today')">Comenzar sesión</button></div><div class="card"><h2>English Score</h2>${skillBars(B.skills)}</div></div><div class="card"><h2>Recomendación automática</h2>${recommend()}</div>`}
function recommend(){const s=B.skills,k=Object.keys(s).sort((a,b)=>s[a]-s[b])[0],txt={listening:'Escucha primero sin leer el texto y después verifica.',speaking:'Haz más Speak Challenge y repite usando shadowing.',vocabulary:'Repasa frases completas y no solo palabras.',comprehension:'Practica instrucciones y preguntas nuevas.',conversation:'Responde con 2 o 3 frases en lugar de una sola.'};return `<div class="notice"><b>Prioridad: ${h(k)}</b><p>${h(txt[k])}</p></div>`}
function skills(){main.innerHTML=`<h1>🎯 Mis habilidades</h1><div class="grid split"><div class="card"><h2>English Score</h2>${skillBars(B.skills)}</div><div class="card"><h2>Plan de mejora</h2>${recommend()}<p class="muted">Las puntuaciones se actualizan con sesiones, retos orales y evaluaciones semanales.</p></div></div>`}
function route(){const phases=[['1–4','Foundation'],['5–8','Daily English'],['9–12','Context English'],['13–16','Communication'],['17–20','Applied English'],['21–24','Real-world Skills'],['25–32','Conversation Expansion'],['33–40','Independent Speaking'],['41–48','A2/B1 Bridge'],['49–52','Final Challenge']];main.innerHTML=`<h1>📅 Ruta 52 semanas</h1><p>Semana actual: <b>${B.week}</b>. Cada cuarta semana incluye evaluación mensual ampliada.</p><div class="grid modules">${phases.map(x=>`<div class="card"><span class="badge">Semanas ${x[0]}</span><h3>${x[1]}</h3><p>Listening · Speaking · Vocabulary · Comprehension · Conversation</p></div>`).join('')}</div>`}
function modules(){const arr=COURSES[B.user.track];main.innerHTML=`<h1>📚 Primer mes · ${h(TRACKS[B.user.track].name)}</h1><p>Estas cuatro semanas son el bloque académico completo inicial para validar la metodología antes de llenar las 52 semanas.</p><div class="grid modules">${arr.map(w=>`<div class="card"><span class="badge ${B.week>w.week?'ok':''}">Semana ${w.week}</span><h3>${h(w.title)}</h3>${w.phrases.slice(0,3).map(p=>`<div class="lesson">${h(p[0])}</div>`).join('')}<button class="secondary" onclick="openWeek(${w.week})">Practicar</button></div>`).join('')}</div>`}
function openWeek(w){sessionData=(COURSES[B.user.track]||[]).find(x=>x.week===w)||currentCourse();renderSession()}
function today(){sessionData=currentCourse();renderSession()}
function renderSession(){const c=sessionData,mins=TRACKS[B.user.track].minutes;main.innerHTML=`<h1>▶ ${h(c.title)}</h1><p>Sesión sugerida: <b>${mins} min</b> · escucha, repite, comprende y produce.</p><div class="grid split"><div class="card"><h2>Frases clave</h2>${c.phrases.map((p,i)=>`<div class="lesson"><b>${h(p[0])}</b><div class="phon">${h(p[1])}</div><div>${h(p[2])}</div><div class="row" style="margin-top:8px"><button class="primary small" onclick='speakText(${JSON.stringify(p[0])})'>🔊</button><button class="ghost small" onclick='markReview(${JSON.stringify(c.week+"_"+i)},${JSON.stringify(p[0])},${JSON.stringify(p[2])},${JSON.stringify(p[1])})'>⭐ Repasar</button></div></div>`).join('')}</div><div class="card"><h2>Producción</h2><div class="phrase">${h(c.question)}</div><button class="primary" onclick='speakText(${JSON.stringify(c.question)})'>🔊 Escuchar pregunta</button><p>Responde primero sin ver el modelo.</p><button class="secondary" onclick="modelBox.classList.remove('hidden')">Mostrar modelo</button><div id="modelBox" class="hidden notice" style="margin-top:10px">${h(c.model)}</div><hr style="border-color:#334b69"><button class="success" onclick="completeSession()">✓ Completar sesión</button></div></div>`}
function speakText(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}
async function markReview(id,en,es,ph){const r=await rpc('addReviewItem',token,{itemId:B.user.track+'_'+id,english:en,spanish:es,phonetic:ph});toast(r.message||'Guardado')}
async function completeSession(){try{setLoading(true);const c=sessionData||currentCourse(),t=TRACKS[B.user.track];const r=await rpc('saveLearningSession',token,{minutes:t.minutes,xp:50,week:B.week,unit:c.title,lessonKey:B.user.track+'_w'+c.week,score:85,skillDelta:{listening:2,speaking:2,vocabulary:2,comprehension:2,conversation:1}});if(!r.ok)throw new Error(r.message);B=r.bootstrap;toast('+50 XP · Sesión guardada en Google Sheets');home()}catch(e){toast(e.message)}finally{setLoading(false)}}
function speak(){const c=currentCourse();main.innerHTML=`<h1>🎙 Speak Challenge</h1><div class="grid split"><div class="card"><span class="badge vio">${h(c.title)}</span><div class="phrase">${h(c.question)}</div><button class="primary" onclick='speakText(${JSON.stringify(c.question)})'>🔊 Escuchar</button><button class="success" onclick='startMic(${JSON.stringify(c.model)},${JSON.stringify(c.question)})'>🎙 Responder</button><div id="speechResult"></div></div><div class="card"><h3>Respuesta modelo</h3><p>${h(c.model)}</p><button class="secondary" onclick='speakText(${JSON.stringify(c.model)})'>🔊 Escuchar modelo</button><p class="muted">La puntuación actual mide coincidencia de reconocimiento de voz, no análisis fonético profesional.</p></div></div>`}
function similarity(a,b){const A=new Set(a.toLowerCase().replace(/[.,?!]/g,'').split(/\s+/)),B2=new Set(b.toLowerCase().replace(/[.,?!]/g,'').split(/\s+/));return Math.round([...A].filter(x=>B2.has(x)).length/Math.max(A.size,B2.size)*100)}
function startMic(model,q){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Usa Chrome o Edge para reconocimiento de voz.');return}const r=new SR();r.lang='en-US';speechResult.innerHTML='<p>🎙 Escuchando...</p>';r.onresult=async e=>{const heard=e.results[0][0].transcript,score=similarity(heard,model);speechResult.innerHTML=`<div class="xp">${score}%</div><p>Escuché: <b>${h(heard)}</b></p>`;const s=await rpc('saveSpeakResult',token,{score,context:currentCourse().title,question:q,heard,model});if(s.ok){B=s.bootstrap;toast('Speak Challenge guardado · +'+s.xp+' XP')}};r.onerror=()=>speechResult.innerHTML='<p>No pude reconocer la respuesta. Intenta otra vez.</p>';r.start()}
async function review(){main.innerHTML='<h1>🧠 Repaso inteligente</h1><div class="card">Cargando...</div>';try{const r=await rpc('getDueReviews',token);if(!r.ok)throw new Error(r.message);main.innerHTML=`<h1>🧠 Repaso inteligente</h1><p>Intervalos: hoy → 1 → 3 → 7 → 15 → 30 días.</p>${r.items.length?`<div class="grid modules">${r.items.map(x=>`<div class="card"><span class="badge warn">Nivel ${x.level}</span><div class="phrase" style="font-size:20px">${h(x.english)}</div><div class="phon">${h(x.phonetic)}</div><p>${h(x.spanish)}</p><button class="primary small" onclick='speakText(${JSON.stringify(x.english)})'>🔊</button> <button class="success small" onclick='reviewResult(${JSON.stringify(x.itemId)},true)'>Lo recordé</button> <button class="ghost small" onclick='reviewResult(${JSON.stringify(x.itemId)},false)'>Me costó</button></div>`).join('')}</div>`:'<div class="card"><h3>No hay repaso vencido.</h3><p>Marca frases con ⭐ durante tus sesiones.</p></div>'}` }catch(e){main.innerHTML='<div class="card">'+h(e.message)+'</div>'}}
async function reviewResult(id,ok){const r=await rpc('saveReviewResult',token,id,ok);if(r.ok){toast(ok?'+10 XP · próxima revisión programada':'Reprogramado para mañana');review()}}
function weekly(){const c=currentCourse();let qs=c.phrases.map((p,i)=>({en:p[0],correct:p[2],opts:[p[2],...c.phrases.filter((_,j)=>j!==i).map(x=>x[2]).slice(0,3)].sort(()=>Math.random()-.5)}));sessionData={quiz:qs,q:0,correct:0,course:c};renderWeeklyQ()}
function renderWeeklyQ(){const q=sessionData.quiz[sessionData.q];main.innerHTML=`<h1>🏆 Weekly Challenge</h1><div class="card"><span class="badge">Pregunta ${sessionData.q+1}/5</span><div class="phrase">${h(q.en)}</div><button class="ghost small" onclick='speakText(${JSON.stringify(q.en)})'>🔊 Escuchar</button><p>Selecciona el significado:</p>${q.opts.map(o=>`<button class="choice" onclick='answerWeekly(this,${JSON.stringify(o)},${JSON.stringify(q.correct)})'>${h(o)}</button>`).join('')}</div>`}
function answerWeekly(btn,a,c){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(a===c){btn.classList.add('correct');sessionData.correct++}else btn.classList.add('wrong');setTimeout(()=>{sessionData.q++;sessionData.q<5?renderWeeklyQ():finishWeekly()},450)}
async function finishWeekly(){const base=Math.round(sessionData.correct/5*100),scores={listening:Math.min(100,base+5),speaking:B.skills.speaking,vocabulary:base,comprehension:base,conversation:Math.round((base+B.skills.conversation)/2)};main.innerHTML='<div class="card">Guardando resultado...</div>';try{const r=await rpc('saveWeeklyEvaluation',token,scores);if(!r.ok)throw new Error(r.message);B=r.bootstrap;main.innerHTML=`<h1>Resultado semanal: ${r.average}%</h1><div class="card">${skillBars(B.skills)}<div class="notice"><b>Semana siguiente desbloqueada.</b><p>El motor priorizará automáticamente la habilidad más baja.</p></div><button class="primary" onclick="go('home')">Continuar</button></div>`}catch(e){main.innerHTML='<div class="card">'+h(e.message)+'</div>'}}
function achievements(){const defs=[['🏅 Primera sesión',B.minutes>0],['⭐ 500 XP',B.xp>=500],['🔥 7 días',B.streak>=7],['🎙 Speaking 70',B.skills.speaking>=70],['🎓 Puente A2',B.level.includes('A2')||B.level.includes('B1')]];main.innerHTML=`<h1>⭐ XP y logros</h1><div class="card"><div class="xp">${B.xp} XP</div><p>Continúa las sesiones y Weekly Challenges para desbloquear logros.</p></div><div class="grid modules">${defs.map(x=>`<div class="card" style="opacity:${x[1]?1:.45}"><h3>${x[0]}</h3><span class="badge ${x[1]?'ok':''}">${x[1]?'Desbloqueado':'Bloqueado'}</span></div>`).join('')}</div>`}
async function teacher(){main.innerHTML='<h1>👨‍🏫 Panel docente</h1><div class="card">Cargando...</div>';try{const r=await rpc('getTeacherDashboard',token);if(!r.ok)throw new Error(r.message);main.innerHTML=`<h1>👨‍🏫 Panel docente</h1><div class="grid stats">${stat('👥',r.students.length,'Alumnos')}${stat('⚠️',r.students.filter(x=>x.alert!=='Normal').length,'Alertas')}${stat('🎙',r.students.filter(x=>x.skills.speaking<60).length,'Speaking <60')}${stat('📚',r.students.reduce((a,x)=>a+x.minutes,0),'Minutos')}${stat('⭐',r.students.reduce((a,x)=>a+x.xp,0),'XP total')}</div><div class="card"><div class="tablewrap"><table><tr><th>Alumno</th><th>Ruta</th><th>Semana</th><th>Nivel</th><th>Speaking</th><th>Minutos</th><th>XP</th><th>Alerta</th></tr>${r.students.map(s=>`<tr><td>${h(s.name)}</td><td>${h(TRACKS[s.track]?.name||s.track)}</td><td>${s.week}</td><td>${h(s.level)}</td><td>${s.skills.speaking}%</td><td>${s.minutes}</td><td>${s.xp}</td><td>${h(s.alert)}</td></tr>`).join('')}</table></div></div>`}catch(e){main.innerHTML='<div class="card">'+h(e.message)+'</div>'}}
async function admin(){main.innerHTML='<h1>🛡 Administración</h1><div class="card">Cargando...</div>';try{const r=await rpc('getAdminData',token);if(!r.ok)throw new Error(r.message);main.innerHTML=`<h1>🛡 Administración</h1><div class="grid split"><div class="card"><h2>Crear usuario</h2><label>Nombre</label><input id="aname"><label>Usuario</label><input id="auser"><label>Contraseña</label><input id="apass" type="password"><label>Rol</label><select id="arole"><option value="student">Alumno</option><option value="teacher">Profesor</option><option value="admin">Administrador</option></select><label>Ruta</label><select id="atrack"><option value="adult">Adulto / Profesional</option><option value="university">Universitario</option><option value="kids">Niños 10–12</option><option value="teens">Adolescentes 13–17</option></select><button class="success" style="margin-top:12px" onclick="createUser()">Crear usuario</button></div><div class="card"><h2>Configuración</h2><p>Versión: <b>${h(r.config.appVersion||'3.2.1')}</b></p><p>Aprobación: <b>${h(r.config.passScore||80)}%</b></p><p>Intentos máximos: <b>${h(r.config.maxAttempts||3)}</b></p><div class="notice">El login, progreso, XP y evaluaciones ya se guardan en Google Sheets.</div></div></div><div class="card"><h2>Usuarios</h2><div class="tablewrap"><table><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Ruta</th><th>Estado</th><th>Acciones</th></tr>${r.users.map(x=>`<tr><td>${h(x.username)}</td><td>${h(x.name)}</td><td>${h(x.role)}</td><td>${h(TRACKS[x.track]?.name||x.track)}</td><td>${x.active?'Activo':'Inactivo'}</td><td><button class="ghost small" onclick='toggleUser(${JSON.stringify(x.username)},${!x.active})'>${x.active?'Desactivar':'Activar'}</button> <button class="secondary small" onclick='resetPass(${JSON.stringify(x.username)})'>Cambiar contraseña</button></td></tr>`).join('')}</table></div></div>`}catch(e){main.innerHTML='<div class="card">'+h(e.message)+'</div>'}}
async function createUser(){const r=await rpc('adminCreateUser',token,{name:aname.value,username:auser.value,password:apass.value,role:arole.value,track:atrack.value});toast(r.message||'Listo');if(r.ok)admin()}
async function toggleUser(u,a){const r=await rpc('adminSetActive',token,u,a);toast(r.message||'Actualizado');if(r.ok)admin()}
async function resetPass(u){const p=prompt('Nueva contraseña para '+u+' (mínimo 6 caracteres):');if(!p)return;const r=await rpc('adminResetPassword',token,u,p);toast(r.message||'Actualizado')}
restore();
</script>
</body>
